<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mathe-Lernapp</title>
<link rel="icon" href="mathe.ico">
<style>
:root{
  --orange:#6c4fd8; --orange-d:#4b31a8; --rot:#d6336c; --blau:#1f6fd1; --gruen:#2e9e4f;
  --gelb:#ffd84d; --bg:#eef3ff; --karte:#ffffff; --text:#2b2b2b; --grau:#6b6b7b;
  --tinte:#1f3c9a; --kaestchen:#c9daf3;
}
*{box-sizing:border-box}
body{margin:0;font-family:"Segoe UI",Verdana,Arial,sans-serif;background:var(--bg);color:var(--text);font-size:20px}
header{background:linear-gradient(90deg,#6c4fd8,#1f6fd1);color:#fff;padding:12px 20px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;box-shadow:0 3px 8px rgba(0,0,0,.15)}
header h1{margin:0;font-size:28px;flex:1;cursor:pointer;white-space:nowrap}
.reiter{display:flex;gap:6px;flex-wrap:wrap}
.reiter button{border:none;border-radius:999px;padding:8px 16px;font-size:18px;font-family:inherit;font-weight:bold;cursor:pointer;background:rgba(255,255,255,.2);color:#fff}
.reiter button.an{background:#fff;color:var(--orange)}
.sterne{background:rgba(255,255,255,.2);border-radius:999px;padding:6px 16px;font-weight:bold;font-size:22px}
main{max-width:1000px;margin:0 auto;padding:20px 16px 60px}
h2{color:var(--orange);margin:10px 0 12px}
.hinweis{color:var(--grau);font-size:17px;margin:0 0 14px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:24px}
.chip{border:3px solid var(--orange);background:#fff;border-radius:999px;padding:8px 14px;font-size:17px;cursor:pointer;font-family:inherit}
.chip.an{background:var(--orange);color:#fff}
.modi{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px}
.modus{background:var(--karte);border:none;border-radius:20px;padding:22px 16px;text-align:center;cursor:pointer;box-shadow:0 4px 0 var(--orange-d),0 6px 14px rgba(0,0,0,.1);font-family:inherit;font-size:20px;transition:transform .1s}
.modus:hover{transform:translateY(-3px)}
.modus .ic{font-size:50px;display:block;margin-bottom:6px}
.modus b{display:block;font-size:22px;color:var(--orange)}
.modus small{color:var(--grau);font-size:16px}
.leiste{display:flex;align-items:center;gap:10px;margin-bottom:16px;flex-wrap:wrap}
.btn{border:none;border-radius:14px;padding:12px 20px;font-size:20px;font-family:inherit;cursor:pointer;background:var(--orange);color:#fff;box-shadow:0 3px 0 var(--orange-d);font-weight:bold}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--orange-d)}
.btn.grau{background:#ddd;color:#333;box-shadow:0 3px 0 #aaa}
.btn.gruen{background:var(--gruen);box-shadow:0 3px 0 #1d6b34}
.btn.blau{background:var(--blau);box-shadow:0 3px 0 #123c7a}
.btn.gelb{background:var(--gelb);color:#5a4300;box-shadow:0 3px 0 #c9a514}
.btn.klein{padding:8px 14px;font-size:17px}
.fortschritt{flex:1;min-width:140px;height:16px;background:#fff;border-radius:999px;overflow:hidden;border:2px solid var(--orange)}
.fortschritt div{height:100%;background:var(--gruen);transition:width .3s}
.box{background:var(--karte);border-radius:22px;padding:24px;box-shadow:0 6px 16px rgba(0,0,0,.1)}
.kapitel{font-size:15px;color:#fff;background:var(--blau);display:inline-block;padding:3px 10px;border-radius:999px;margin-bottom:10px}
.frage{font-size:23px;font-weight:bold;margin:4px 0 14px;line-height:1.35}
.feedback{font-size:22px;margin-top:14px;font-weight:bold;min-height:30px}
.feedback.ok{color:var(--gruen)} .feedback.nein{color:var(--rot)} .feedback.tipp{color:#8a5a00}
.mitte{display:flex;justify-content:center;gap:12px;margin-top:18px;flex-wrap:wrap}
.ende{text-align:center;padding:30px 10px}
.ende .gross{font-size:72px}
.wackel{animation:wackel .35s}
@keyframes wackel{0%,100%{transform:translateX(0)}25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
@media (max-width:600px){ body{font-size:18px} header h1{font-size:22px} .frage{font-size:20px} }

/* ---------- Rechenheft (Kästchenpapier) ---------- */
.heft{background-color:#fff;background-image:linear-gradient(var(--kaestchen) 1px,transparent 1px),linear-gradient(90deg,var(--kaestchen) 1px,transparent 1px);background-size:32px 32px;border-radius:16px;padding:20px 22px;border:2px solid #dbe6f7;overflow-x:auto}
.mitneben{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:16px;align-items:start}
.mitneben.unten{grid-template-columns:minmax(0,1fr)}
.mitneben.unten .neben{justify-self:start}
@media (max-width:760px){.mitneben{grid-template-columns:minmax(0,1fr)}.mitneben .neben{justify-self:start}}
.neben{max-width:100%;box-sizing:border-box;background:#fffdf3;border:2px solid #f0d98a;border-radius:16px;padding:10px 12px}
.nkopf{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:8px;font-size:17px;color:#7a5a00}
.nweg{border:none;background:#fff;border-radius:10px;padding:4px 10px;font:inherit;font-size:15px;cursor:pointer;box-shadow:0 2px 0 #d8c37a}
.nfeld{display:grid;background:#fff}
.nfeld input{width:100%;min-width:0;height:34px;box-sizing:border-box;border:none;border-right:1px solid #c8d6f0;border-bottom:1px solid #c8d6f0;padding:0;margin:0;text-align:center;font-family:"Comic Sans MS","Segoe Print","Chalkboard SE",cursive;font-size:22px;color:var(--tinte);background:transparent;outline:none}
.nfeld input:focus{background:#fff3c4}
.nfeld input:nth-child(-n+10){border-top:1px solid #c8d6f0}
.nfeld input:nth-child(10n+1){border-left:1px solid #c8d6f0}
.packung b{white-space:nowrap}
.heft .blk{margin:0 0 22px}
.heft .blk:last-child{margin-bottom:0}
.rg{display:inline-grid;align-items:stretch;font-family:"Comic Sans MS","Segoe Print","Chalkboard SE",cursive;font-size:30px;color:var(--tinte)}
.rg .c{padding:6px 5px;text-align:right;white-space:nowrap;min-height:60px;display:flex;align-items:center;justify-content:flex-end}
.rg .c.o{border-bottom:3px solid var(--tinte)}
.rg .c.op{justify-content:center;padding:6px 3px}
.flex{display:flex;flex-wrap:wrap;align-items:center;gap:8px;font-family:"Comic Sans MS","Segoe Print","Chalkboard SE",cursive;font-size:28px;color:var(--tinte)}
.ein{font:inherit;font-size:28px;text-align:right;border:3px dashed #93aee0;border-radius:10px;background:rgba(255,255,255,.9);color:var(--tinte);padding:2px 6px;height:50px;outline:none}
.ein:focus{border-style:solid;border-color:var(--orange);box-shadow:0 0 0 3px rgba(108,79,216,.2)}
.ein.ok,.wahl.ok button.an,.wahl.gesperrt button.an{border:3px solid var(--gruen);background:#e3f6e8}
.ein.falsch,.wahl.falsch button.an{border:3px solid var(--rot);background:#fde4e4}
.ein.zeig{border:3px solid var(--gruen);background:#f2fbf4;color:var(--gruen)}
.wahl{display:inline-flex;gap:6px}
.wahl button{font:inherit;font-size:26px;min-width:52px;height:50px;border:3px dashed #93aee0;border-radius:10px;background:#fff;color:var(--tinte);cursor:pointer}
.wahl button.an{border:3px solid var(--orange);background:#ece6ff}
.kreuz{border-collapse:collapse;font-family:"Comic Sans MS","Segoe Print",cursive;font-size:28px;color:var(--tinte);background:rgba(255,255,255,.6)}
.kreuz td{border:3px solid var(--tinte);padding:6px 10px;text-align:center;min-width:90px;height:62px}
.kreuz tr:first-child td,.kreuz td:first-child{background:#ece6ff;font-weight:bold}
.frei{opacity:.75}
.packungen{display:flex;gap:16px;flex-wrap:wrap;margin-bottom:14px}
.packung{flex:1;min-width:220px;background:#fff8e6;border:3px solid #f2b84b;border-radius:16px;padding:12px 16px;font-size:20px;text-align:center}
.packung .ic{font-size:40px;display:block}
.packung b{font-size:22px;color:#8a5a00}
.erkl{background:#fff8e6;border-left:6px solid var(--gelb);border-radius:12px;padding:12px 16px;margin-bottom:14px;font-size:19px;line-height:1.45}
.eule{display:flex;align-items:center;gap:12px;margin-top:6px}
.eule .tier{font-size:46px}
.banner{display:flex;align-items:center;gap:16px;background:#fff;border-radius:20px;padding:16px 20px;box-shadow:0 4px 0 #c9a514,0 6px 14px rgba(0,0,0,.08);margin-top:28px;cursor:pointer;border:none;width:100%;font-family:inherit;font-size:19px;text-align:left}
.banner .ic{font-size:46px}
.ergebnis{font-size:26px;font-weight:bold}

/* ---------- Prüfungen ---------- */
.pliste{display:grid;gap:14px}
.pkarte{background:#fff;border-radius:18px;padding:16px 18px;box-shadow:0 4px 12px rgba(0,0,0,.08);display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.pkarte .ic{font-size:44px}
.pkarte .info{flex:1;min-width:220px}
.pkarte .info b{font-size:21px;color:var(--orange)}
.pkarte .info small{display:block;color:var(--grau);font-size:16px}
.pkarte.an{outline:4px solid var(--orange)}
.vorschau{overflow:auto;background:#d9dfea;border-radius:18px;padding:20px;margin-top:18px}
.vorschau .blatt{background:#fff;margin:0 auto;box-shadow:0 4px 16px rgba(0,0,0,.2);padding:12mm}
#druck{display:none}

/* Druckblatt: 1 Kästchen = 6 mm */
.blatt{width:210mm;font-family:"Segoe UI",Verdana,Arial,sans-serif;color:#111;font-size:4mm}
.blatt *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
.pkopf{display:flex;justify-content:space-between;align-items:flex-end;border-bottom:0.6mm solid #333;padding-bottom:2mm;margin-bottom:4mm}
.pkopf h1{font-size:6mm;margin:0;color:#4b31a8}
.pkopf .nr{font-size:3.4mm;color:#555;text-align:right}
.pname{display:flex;gap:10mm;font-size:4.2mm;margin-bottom:5mm}
.pname span{flex:1;border-bottom:0.3mm solid #333;padding-bottom:1mm}
.pa{margin-bottom:5mm;break-inside:avoid;page-break-inside:avoid}
.pa h3{font-size:4.6mm;margin:0 0 2mm;display:flex;justify-content:space-between;gap:4mm}
.pa h3 small{font-weight:normal;font-size:3.6mm;white-space:nowrap}
.kar{width:186mm;padding:6mm;background-color:#fff;background-image:linear-gradient(#b9cbe6 0.2mm,transparent 0.2mm),linear-gradient(90deg,#b9cbe6 0.2mm,transparent 0.2mm);background-size:6mm 6mm;display:grid;column-gap:6mm;row-gap:6mm;border:0.3mm solid #b9cbe6}
.pk{break-inside:avoid;page-break-inside:avoid}
.pl{height:6mm;margin-bottom:6mm;display:flex}
.pl:last-child{margin-bottom:0}
.pl.st{box-shadow:0 0.5mm 0 #222;width:max-content}
.z{width:6mm;height:6mm;line-height:6mm;text-align:center;font-family:"Comic Sans MS","Segoe Print",cursive;font-size:4.6mm;flex:none}
.z.e{font-size:3.8mm;letter-spacing:-0.2mm}
.z.k{width:0;overflow:visible;text-align:left;text-indent:-1mm}
.z.l,.pt .l{color:#d0021b;font-weight:bold}
.pt{line-height:6mm;font-size:3.8mm;margin-bottom:6mm;background:#fff}
.pt b{font-weight:bold}
.pkreuz{border-collapse:collapse;margin-bottom:6mm}
.pkreuz td{width:18mm;height:12mm;padding:0;text-align:center;font-family:"Comic Sans MS","Segoe Print",cursive;font-size:4.6mm;box-shadow:inset 0 0 0 0.35mm #222}
.pfuss{display:flex;justify-content:space-between;align-items:center;margin-top:4mm;font-size:4.6mm;font-weight:bold}
.pfuss .smile{font-size:7mm;letter-spacing:3mm}


/* ---------- Neue Aufgabentypen ---------- */
.bereich h3{margin:4px 0 8px;font-size:17px;color:var(--grau);text-transform:uppercase;letter-spacing:.06em}
.bereich .chips{margin-bottom:14px}
table.stellen{border-collapse:collapse;font-family:"Comic Sans MS","Segoe Print",cursive;font-size:30px;color:var(--tinte);background:rgba(255,255,255,.6)}
table.stellen td{width:52px;height:52px;border:1px solid var(--kaestchen);text-align:center;padding:2px}
table.stellen td.op{font-weight:bold}
table.stellen tr.ue td{height:36px}
table.stellen tr.erg td{border-top:4px solid var(--tinte)}
.ein.zf{width:44px;height:46px;text-align:center;padding:0}
.ein.zf.klein{width:30px;height:30px;font-size:18px;border-width:2px}
.dreieck{position:relative;width:360px;height:310px;max-width:100%}
.dreieck svg{position:absolute;left:0;top:0;width:360px;height:300px}
.dreieck span{position:absolute;transform:translate(-50%,-50%);font-family:"Comic Sans MS","Segoe Print",cursive;font-size:28px;color:#fff;font-weight:bold}
.dreieck span.aus{color:var(--tinte)}
.ztab{border-collapse:collapse;background:#fff;font-size:19px}
.ztab th,.ztab td{border:2px solid #b9c6e6;padding:6px 10px;text-align:left;white-space:nowrap}
.ztab th{background:#ece6ff;color:var(--orange-d)}
.ztab.fahrplan td{padding:3px 10px;font-size:17px}
.ztab .ein{height:42px;font-size:24px}
.karte{display:inline-block;background:#fff;border:3px solid #b9c6e6;border-radius:999px;padding:4px 14px;font-family:"Segoe UI",Verdana,sans-serif;font-size:19px;color:var(--text);min-width:150px}
.tag{font-family:"Segoe UI",Verdana,sans-serif;font-size:17px;color:var(--grau);min-width:110px;display:inline-block}
.wahl.bild button{height:auto;padding:8px;font-size:20px}
.wahl.bild .uhr{display:block}
.flex .wahl button{font-size:20px}
/* Druck */
.eng .pl{margin-bottom:0}
.lk{display:inline-block;height:4.6mm;border-bottom:0.3mm solid #222;vertical-align:bottom}
.puhr{display:inline-block;text-align:center;margin:0 4mm 2mm 0;vertical-align:middle}
.ptab{border-collapse:collapse;margin:1mm 0 2mm;font-size:3.6mm}
.ptab th,.ptab td{border:0.3mm solid #555;padding:0.6mm 2mm;line-height:5mm;text-align:left;white-space:nowrap}
.ptab th{background:#eee}
.pdreieck{width:70mm;height:58mm;display:block}
.pdreieck text{font-family:"Comic Sans MS","Segoe Print",cursive;font-size:26px;text-anchor:middle;fill:#111}
.pdreieck text.lt{fill:#d0021b;font-weight:bold}
.pkarte2{display:inline-block;border:0.3mm solid #555;border-radius:4mm;padding:0 3mm;margin:1mm 2mm 1mm 0}
@page{size:A4;margin:12mm}
@media print{
  body{background:#fff;font-size:12pt}
  header,main{display:none!important}
  #druck{display:block}
  #druck .blatt{width:186mm;padding:0}
}
/* Spielecke */
.preis{display:inline-block;background:var(--gelb);color:#5a4300;border-radius:999px;padding:2px 10px;font-size:16px;font-weight:bold;margin-top:6px}
.modus:disabled{opacity:.45;cursor:not-allowed;transform:none}
.spielinfo{display:flex;gap:16px;justify-content:center;font-size:22px;font-weight:bold;margin-bottom:10px;flex-wrap:wrap}
.himmel{position:relative;height:440px;border-radius:22px;overflow:hidden;background:linear-gradient(#8fd3ff,#e6f7ff);touch-action:manipulation;user-select:none}
.ballon{position:absolute;font-size:58px;cursor:pointer;line-height:1;user-select:none}
.memory{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;max-width:460px;margin:0 auto}
.mkarte{aspect-ratio:1;border:none;border-radius:16px;font-size:44px;cursor:pointer;background:var(--orange);color:transparent;box-shadow:0 3px 0 var(--orange-d);font-family:inherit}
.mkarte.offen{background:#fff;color:inherit;box-shadow:0 3px 0 #ccc}
.mkarte.weg{background:#dff3e5;color:inherit;box-shadow:none;opacity:.6;cursor:default}
.spielfeld{display:block;margin:0 auto;border-radius:14px;width:auto;height:auto;max-width:100%;max-height:calc(100vh - 230px);touch-action:none;user-select:none}
.tetris{display:flex;gap:14px;justify-content:center;align-items:flex-start}
.tetris .spielfeld{margin:0;min-width:0;max-width:calc(100% - 134px)}
.tseite{flex:none;width:120px;font-size:16px;background:var(--karte);border-radius:16px;padding:10px;text-align:center;box-shadow:0 3px 10px rgba(0,0,0,.08)}
.tseite canvas{display:block;margin:6px auto 0;border-radius:10px}
#snake{display:block;margin:0 auto;background:#1d3b2a;border-radius:14px;max-width:100%;touch-action:none}
.steuer{display:grid;grid-template-columns:repeat(3,70px);gap:8px;justify-content:center;margin-top:12px}
.steuer button{height:60px;font-size:28px;border:none;border-radius:14px;background:var(--blau);color:#fff;cursor:pointer}
.code{font-family:Consolas,monospace;font-size:40px;letter-spacing:4px;background:#fff;border:4px dashed var(--orange);border-radius:16px;padding:12px 20px;display:inline-block;margin:10px 0}
.codeeingabe{font-family:Consolas,monospace;font-size:30px;letter-spacing:3px;text-transform:uppercase;padding:10px 14px;border:3px solid var(--orange);border-radius:14px;width:260px;max-width:100%;text-align:center}
</style>
</head>
<body>
<header>
  <h1 onclick="startseite()">🦉 Mathe-Lernapp</h1>
  <nav class="reiter">
    <button id="r_ueben" onclick="startseite()">📚 Üben</button>
    <button id="r_pruef" onclick="pruefungen()">🖨️ Prüfungen</button>
    <button id="r_spiel" onclick="spielecke()">🎮 Spielecke</button>
  </nav>
  <span class="sterne" id="sterne" style="cursor:pointer" title="Zur Spielecke" onclick="spielecke()">⭐ 0</span>
</header>
<main id="app"></main>
<div id="druck"></div>

<script>
/* =====================================================================
   MATHE-LERNAPP 4. KLASSE
   Themen aus dem Heft: Teilen durch 10/100/Zehnerzahlen, halbschriftlich
   malnehmen, halbschriftlich teilen, Euro und Cent teilen, Preisvergleich.
   Alle Aufgaben werden zufällig erzeugt, es gehen also nie die Aufgaben aus.
   ===================================================================== */

/* ---------- Zufall (mit Startzahl, damit Prüfungen wiederholbar sind) ---------- */
function zufall(seed) {
  let a = seed >>> 0;
  return function () {
    a = (a + 0x6D2B79F5) >>> 0;
    let t = a;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
const R = zufall(Date.now() % 1000000007);
function zz(r, a, b) { return a + Math.floor(r() * (b - a + 1)); }
function eins(r, liste) { return liste[Math.floor(r() * liste.length)]; }
function mischenR(r, a) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(r() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function eu(c) { return (c / 100).toFixed(2).replace(".", ","); }

/* ---------- Aufgaben-Erzeuger (liefern nur Zahlen) ---------- */
function genZehner(r, sorte) {
  sorte = sorte || eins(r, ["z10", "z100", "zz"]);
  const liste = [], schon = new Set();
  while (liste.length < 4) {
    let a, b;
    if (sorte === "z10") { const q = r() < 0.4 ? zz(r, 3, 9) : zz(r, 11, 99); a = q * 10; b = 10; }
    else if (sorte === "z100") { const q = r() < 0.6 ? zz(r, 2, 9) : zz(r, 11, 49); a = q * 100; b = 100; }
    else { b = zz(r, 2, 9) * 10; a = zz(r, 2, 9) * b; }
    if (schon.has(a + ":" + b)) continue;
    schon.add(a + ":" + b); liste.push([a, b]);
  }
  return { art: "zehner", sorte, liste };
}
function stellen(n) { // 125 -> [100, 20, 5]
  const s = String(n), out = [];
  for (let i = 0; i < s.length; i++) { const w = Number(s[i]) * Math.pow(10, s.length - 1 - i); if (w) out.push(w); }
  return out;
}
function genMal(r, gross) {
  const a = zz(r, 3, 9);
  let b;
  if (gross === undefined) gross = r() < 0.3;
  do { b = gross ? zz(r, 102, 199) : zz(r, 13, 98); } while (b % 10 === 0 || stellen(b).length < 2);
  return { art: "mal", a, b, teile: stellen(b) };
}
function genTeil(r, gross) {
  let d, q, z;
  do {
    d = zz(r, 2, 9); q = zz(r, 11, 49); z = d * q;
  } while (q % 10 === 0 || (gross === true && z < 100) || (gross === false && z > 99) || z > 400);
  const zehner = Math.floor(q / 10) * 10;
  return { art: "teil", z, d, q, teile: [d * zehner, d * (q % 10)] };
}
const DINGE = [
  { mehr: "Bleistiften", ein: "ein Bleistift" }, { mehr: "Radiergummis", ein: "ein Radiergummi" },
  { mehr: "Joghurts", ein: "ein Joghurt" }, { mehr: "Brezen", ein: "eine Breze" },
  { mehr: "Heften", ein: "ein Heft" }, { mehr: "Äpfeln", ein: "ein Apfel" },
  { mehr: "Muffins", ein: "ein Muffin" }, { mehr: "Stickern", ein: "ein Sticker" },
  { mehr: "Tennisbällen", ein: "ein Tennisball" }, { mehr: "Filzstiften", ein: "ein Filzstift" }
];

/* ---------- Aufgaben zum Rechnen am Bildschirm bauen ----------

function bauen(d, modus) {

const ZEHNER_TITEL = { z10: "Teile durch 10.", z100: "Teile durch 100.", zz: "Teile durch Zehnerzahlen." };

function bauMal(d, modus) {

    tipp: `Rechne zuerst die unteren Zeilen: ${teile.map(t => a + " · " + t).join(" und ")}. Zähle dann die Ergebnisse zusammen und schreibe das Ergebnis nach oben.`

/* ---------- Felder einsammeln, lesen, prüfen ---------- */
function alleFelder(t) {
  const out = [];
  const nimm = x => { if (Array.isArray(x)) x.forEach(nimm); else if (x && x.feld) out.push(x); else if (x && x.zellen) nimm(x.zellen); };
  t.bloecke.forEach(b => { nimm(b.zeilen || []); nimm(b.felder || []); });
  return out;
}
function lesen(f) {
  const el = document.getElementById(f.id);
  if (!el) return null;
  if (f.typ === "wahl") return el.dataset.v || null;
  let v = el.value.trim().replace(/\s/g, "").replace(/€|ct/gi, "");
  if (v === "") return null;
  if (f.typ === "euro") {
    v = v.replace(".", ",");
    const m = v.match(/^(\d*)(?:,(\d{0,2}))?$/);
    if (!m || (m[1] === "" && !m[2])) return NaN;
    return Number(m[1] || 0) * 100 + Number(((m[2] || "") + "00").slice(0, 2));
  }
  v = v.replace(/\./g, "");
  return /^\d+$/.test(v) ? Number(v) : NaN;
}
function zeigeWert(f, wert) {
  if (wert === null || wert === undefined) return "";
  return f.typ === "euro" ? eu(wert) : String(wert);
}
function standardPruefen(t) {
  const erg = {}; let leer = false;
  alleFelder(t).forEach(f => { const v = lesen(f); if (v === null && !f.optional) leer = true; erg[f.id] = f.pruef ? f.pruef(v) : v === f.soll; });
  const falsch = Object.values(erg).filter(x => !x).length;
  return { erg, meldung: falsch ? (leer ? "Es sind noch Kästchen leer. Rechne sie noch aus!" : (falsch === 1 ? "Ein Kästchen stimmt noch nicht. Schau es dir nochmal an!" : `${falsch} Kästchen stimmen noch nicht. Schau sie dir nochmal an!`)) : "" };
}
/* Selbst zerlegt: Jeder richtige Weg zählt. */
function zerlegPruefen(o) {
  const erg = {}; let meldung = "";
  const sag = m => { if (!meldung) meldung = m; };
  const benutzt = [];
  o.reihen.forEach(r => {
    const tv = lesen(r.teil), ev = lesen(r.erg);
    if (tv === null && ev === null) { erg[r.teil.id] = null; erg[r.erg.id] = null; return; }
    benutzt.push({ r, tv, ev });
  });
  const endWert = lesen(o.end);
  if (benutzt.length < 2) {
    o.reihen.slice(0, 2).forEach(r => { erg[r.teil.id] = false; erg[r.erg.id] = false; });
    sag("Zerlege die Zahl in mindestens zwei Teile, so wie im Heft.");
  } else {
    let summe = 0, alleDa = true;
    benutzt.forEach(({ tv }) => { if (typeof tv === "number" && !isNaN(tv)) summe += tv; else alleDa = false; });
    benutzt.forEach(({ r, tv, ev }) => {
      let teilOk = typeof tv === "number" && !isNaN(tv) && tv > 0;
      if (tv === null) sag("Es sind noch Kästchen leer. Rechne sie noch aus!");
      if (teilOk && o.name === "teil" && tv % o.d !== 0) { teilOk = false; sag(`${tv} kann man nicht ohne Rest durch ${o.d} teilen. Nimm eine andere Zahl.`); }
      erg[r.teil.id] = teilOk;
      erg[r.erg.id] = teilOk && ev === o.rechne(tv);
      if (ev === null) sag("Es sind noch Kästchen leer. Rechne sie noch aus!");
    });
    if (alleDa && summe !== o.gesamt) {
      benutzt.forEach(({ r }) => { erg[r.teil.id] = false; });
      sag(`Deine Teile ergeben zusammen ${summe}. Sie müssen zusammen ${o.gesamt} ergeben.`);
    }
  }
  erg[o.end.id] = endWert === o.ergebnis;
  if (endWert === null) sag("Oben fehlt noch das Ergebnis.");
  const falsch = Object.values(erg).filter(x => x === false).length;
  if (falsch && !meldung) sag(falsch === 1 ? "Ein Kästchen stimmt noch nicht. Schau es dir nochmal an!" : `${falsch} Kästchen stimmen noch nicht.`);
  return { erg, meldung: falsch ? meldung : "" };
}

/* ---------- Aufgabe anzeigen ---------- */
function feldHtml(f, zeig) {
  if (f.typ === "wahl") {
    return `<span class="wahl${f.optHtml ? " bild" : ""}${zeig ? " gesperrt" : ""}" id="${f.id}${zeig ? "_z" : ""}" data-v="${zeig ? esc(f.soll) : ""}">${f.opt.map((o, i) => `<button type="button" data-w="${esc(o)}" class="${zeig && o === f.soll ? "an" : ""}" onclick="wahlKlick(this)">${f.optHtml ? f.optHtml[i] : esc(o)}</button>`).join("")}</span>`;
  }
  if (f.typ === "ziffer") {
    return `<input class="ein zf${f.klein ? " klein" : ""}${zeig ? " zeig" : ""}" id="${f.id}${zeig ? "_z" : ""}" inputmode="numeric" maxlength="1" autocomplete="off" ${f.weiter && !zeig ? `data-weiter="${f.weiter}"` : ""} value="${zeig ? zeigeWert(f, f.soll) : ""}" ${zeig ? "readonly" : ""}>`;
  }
  const breite = f.typ === "euro" ? 5 : Math.max(2, String(f.soll ?? "000").length) + 1;
  return `<input class="ein${zeig ? " zeig" : ""}" id="${f.id}${zeig ? "_z" : ""}" inputmode="${f.typ === "euro" ? "decimal" : "numeric"}" autocomplete="off" style="width:${breite + 1.2}ch" value="${zeig ? zeigeWert(f, f.soll) : ""}" ${zeig ? "readonly" : ""}>`;
}
function zelleHtml(x, zeig) { return x && x.feld ? feldHtml(x, zeig) : x && x.html !== undefined ? x.html : esc(x); }
function blockHtml(b, zeig) {
  if (b.art === "text") return `<div class="blk">${b.html}</div>`;
  if (NEUE_BLOECKE[b.art]) return NEUE_BLOECKE[b.art](b, zeig);
  if (b.art === "klein") return `<div class="blk hinweis" style="margin-bottom:8px">${b.text}</div>`;
  if (b.art === "flex") return `<div class="blk">${b.zeilen.map(z => `<div class="flex" style="margin-bottom:10px">${z.map(x => `<span>${zelleHtml(x, zeig)}</span>`).join("")}</div>`).join("")}</div>`;
  if (b.art === "kreuz") return `<div class="blk"><table class="kreuz">${b.zeilen.map(z => `<tr>${z.map(x => `<td>${zelleHtml(x, zeig)}</td>`).join("")}</tr>`).join("")}</table></div>`;
  // rechnung: untereinander wie im Heft
  const zeilen = b.zeilen.map(z => Array.isArray(z) ? { zellen: z } : z);
  const n = Math.max(...zeilen.map(z => z.zellen.length));
  const OPS = [":", "·", "=", "€", "ct", "g", "<", ">"];
  return `<div class="blk"><div class="rg" style="grid-template-columns:repeat(${n},auto)">${zeilen.map((z, i) => {
    const zellen = z.zellen.concat(Array(n - z.zellen.length).fill(""));
    return zellen.map(x => `<div class="c${i === 0 && b.strich ? " o" : ""}${typeof x === "string" && OPS.includes(x) ? " op" : ""}${z.frei ? " frei" : ""}">${zelleHtml(x, zeig)}</div>`).join("");
  }).join("")}</div></div>`;
}
function aufgabeHtml(t, zeig) { return `<div class="heft">${t.bloecke.map(b => blockHtml(b, zeig)).join("")}</div>`; }
function wahlKlick(btn) {
  const w = btn.parentElement;
  if (w.classList.contains("gesperrt")) return;
  [...w.children].forEach(c => c.classList.remove("an"));
  btn.classList.add("an"); w.dataset.v = btn.dataset.w;
  w.classList.remove("ok", "falsch");
}

/* =====================================================================
   NEUE THEMEN (Heftseiten vom Oktober): Rechnen bis 1000, schriftlich
   addieren und subtrahieren, Rechendreiecke, Punkt vor Strich,
   Zahlenrätsel, Uhrzeiten, Zeitspannen, Umwandeln, Fahrpläne.
   Nur Aufgabentypen, die so im Heft vorkommen – mit wechselnden Zahlen.
   ===================================================================== */
const NEU_BAU = {}, NEU_DRUCK = {}, NEUE_BLOECKE = {};
function zw(n) { return String(n).padStart(2, "0"); }
function uhrzeit(min, trenner) { min = ((min % 1440) + 1440) % 1440; return zw(Math.floor(min / 60)) + (trenner || ":") + zw(min % 60); }
function dauerText(min) { const h = Math.floor(min / 60), m = min % 60; return h ? (m ? `${h} h ${m} min` : `${h} h`) : `${m} min`; }
/* Feld, das leer bleiben oder 0 sein darf (z. B. „1 h 0 min“, führende Null) */
function FU(u) { const f = F(u || null, "ziffer"); f.optional = true; f.klein = true; f.pruef = v => v === null || v === (u || 0); return f; }

/* Nebenrechnung: freie Kästchen zum selbst Rechnen, wird nicht geprüft */
const OHNE_NEBEN = ["schrift", "uhr"];
const NEBEN_SP = 10, NEBEN_ZE = 6;
function nebenHtml() {
  let z = "";
  for (let i = 0; i < NEBEN_ZE * NEBEN_SP; i++) z += `<input class="nz" maxlength="1" autocomplete="off" data-i="${i}" aria-label="Nebenrechnung">`;
  return `<div class="neben"><div class="nkopf"><b>✏️ Nebenrechnung</b><button class="nweg" onclick="nebenLeeren()" title="Alles löschen">🧽 Löschen</button></div><div class="nfeld" style="grid-template-columns:repeat(${NEBEN_SP},minmax(0,34px))" onkeydown="nebenTaste(event)" oninput="nebenEingabe(event)">${z}</div></div>`;
}
function nebenZelle(i) { return document.querySelector(`.nfeld input[data-i="${i}"]`); }
function nebenEingabe(e) {
  const el = e.target; if (!el.value) return;
  el.value = el.value.replace("*", "·").replace("/", ":").replace("-", "−");
  const n = nebenZelle(+el.dataset.i + 1); if (n && (+el.dataset.i + 1) % NEBEN_SP) n.focus();
}
function nebenTaste(e) {
  const i = +e.target.dataset.i, w = { ArrowLeft: -1, ArrowRight: 1, ArrowUp: -NEBEN_SP, ArrowDown: NEBEN_SP, Enter: NEBEN_SP }[e.key];
  if (e.key === "Backspace" && !e.target.value) { const n = nebenZelle(i - 1); if (n) { e.preventDefault(); n.value = ""; n.focus(); } return; }
  if (w === undefined) return;
  e.preventDefault(); e.stopPropagation();
  const n = nebenZelle(e.key === "Enter" ? (Math.floor(i / NEBEN_SP) + 1) * NEBEN_SP : i + w); if (n) n.focus();
}
function nebenLeeren() { document.querySelectorAll(".nfeld input").forEach(x => x.value = ""); }
function knoepfe() {
  const k = document.getElementById("knoepfe");
  if (runde.geloest) { k.innerHTML = `<button class="btn gruen" onclick="weiter()">Weiter ➜</button>`; return; }
  if (runde.test) { k.innerHTML = `<button class="btn" onclick="pruefen()">✔ Abgeben</button>`; return; }
  k.innerHTML = `<button class="btn" onclick="pruefen()">✔ Prüfen</button><button class="btn gelb" onclick="tipp()">💡 Tipp</button>${runde.versuche >= 2 ? `<button class="btn grau" onclick="loesungZeigen()">👀 Lösung zeigen</button>` : ""}`;
}
function markieren(t, erg, sperren) {
  alleFelder(t).forEach(f => {
    const el = document.getElementById(f.id); if (!el) return;
    el.classList.remove("ok", "falsch");
    if (erg[f.id] === true) el.classList.add("ok");
    else if (erg[f.id] === false) el.classList.add("falsch");

}
function pruefen() {
  const t = runde.liste[runde.i];

  const fb = document.getElementById("fb");

    runde.geloest = true;

    else {
      const stern = !runde.gezeigt && runde.versuche <= 2;
      if (stern) { runde.richtig++; sternDazu(); }
      fb.className = "feedback ok"; fb.textContent = eins(Math.random, LOB) + (stern ? " ⭐" : "");
    }
  } else if (runde.test) {

  } else {

function tipp() {

function loesungZeigen() {

    else el.value = zeigeWert(f, f.soll);

function weiter() {

    const text = anteil === 1 ? "Alles richtig! Du bist bereit für die Probe!" : anteil >= 0.75 ? "Sehr gut! Fast alles richtig." : anteil >= 0.5 ? "Gut! Übe noch ein bisschen weiter." : "Nicht aufgeben! Übe nochmal mit Hilfe.";
    fertig("🏁 Probe-Test", text, "probeTest()", `<p class="ergebnis">${smiley} ${runde.richtig} von ${n} Aufgaben richtig</p>`);
  } else {
    fertig(MODUS_TITEL[runde.modus], "Geschafft! Du hast alle Aufgaben gerechnet.", `ueben('${runde.modus}')`, `<p class="ergebnis">⭐ ${runde.richtig} neue Sterne</p>`);
  }
}

/* ========================== PRÜFUNGEN ZUM AUSDRUCKEN ==========================
   Jede Prüfung wird mit einer Nummer erzeugt. Gleiche Nummer = gleiche Aufgaben,
   so passt das Lösungsblatt immer zum Prüfungsblatt. */
function L(x) { return { l: String(x) }; }      // Lösung (rot, nur auf dem Lösungsblatt)
function txt(x) { return typeof x === "string" ? x : x.l; }
function lang(x) { return txt(x).replace(/,/g, "").replace(/ct|kg/g, "c").length; } // Komma bekommt kein eigenes Kästchen
/* Spalten untereinander ausrichten: Zahlen rechtsbündig, wie im Heft */
function ausrichten(zeilen) {
  const n = Math.max(...zeilen.map(z => z.length)), breite = [];
  for (let s = 0; s < n; s++) breite[s] = Math.max(...zeilen.map(z => z[s] === undefined ? 0 : lang(z[s])));
  return zeilen.map(z => z.map((x, s) => {
    const fehlt = breite[s] - lang(x);
    return [" ".repeat(fehlt), x];
  }).flat());
}
function druckZeile(teile, strich) {
  let h = "";
  teile.forEach(x => {
    const loes = typeof x !== "string", s = txt(x);
    for (const ch of s.match(/ct|kg|./g) || []) h += `<span class="z${loes ? " l" : ""}${ch === "," ? " k" : ch.length > 1 ? " e" : ""}">${ch === " " ? "" : esc(ch)}</span>`;
  });
  return `<div class="pl${strich ? " st" : ""}">${h}</div>`;
}
/* Ein Rechenpäckchen: oben die Aufgabe (unterstrichen), darunter die Zwischenschritte.
   Ohne Lösung bleiben die Zeilen darunter leer zum Selbstrechnen. */
function druckRechnung(zeilen, lsg, opt) {
  opt = opt || {};
  const ausg = ausrichten(zeilen);
  let h = "";
  const leer = opt.leer ?? (zeilen.length - 1);
  if (lsg) h += ausg.map((z, i) => druckZeile(z, i === 0 && opt.strich !== false)).join("");
  else {
    h += druckZeile(ausg[0].filter(x => typeof x === "string"), opt.strich !== false);
    for (let i = 0; i < leer; i++) h += `<div class="pl"></div>`;
  }
  if (lsg) for (let i = zeilen.length - 1; i < leer; i++) h += `<div class="pl"></div>`;
  return h;
}
function druckItem(d, lsg, opt) {
  opt = opt || {};
  if (NEU_DRUCK[d.art]) { const h = NEU_DRUCK[d.art](d, lsg, opt); if (h) return h; }
  if (d.art === "zehner") {
    const z = ausrichten(d.liste.map(([a, b]) => [S(a), ":", S(b), "=", L(a / b)]));
    return `<div class="pk">${z.map(x => druckZeile(lsg ? x : x.filter(y => typeof y === "string"))).join("")}</div>`;
  }
  if (d.art === "mal" && opt.kreuz) {
    const kopf = ["·"].concat(d.teile.map(t => lsg ? `<span class="l">${t}</span>` : ""));
    const unten = [S(d.a)].concat(d.teile.map(t => lsg ? `<span class="l">${d.a * t}</span>` : ""));
    return `<div class="pk"><table class="pkreuz"><tr>${kopf.map(x => `<td>${x}</td>`).join("")}</tr><tr>${unten.map(x => `<td>${x}</td>`).join("")}</tr></table>${druckRechnung([[S(d.a), "·", S(d.b), "=", L(d.a * d.b)]], lsg, { leer: 0 })}</div>`;
  }
  if (d.art === "mal") {
    return `<div class="pk">${druckRechnung([[S(d.a), "·", S(d.b), "=", L(d.a * d.b)]].concat(d.teile.map(t => [S(d.a), "·", L(t), "=", L(d.a * t)])), lsg, { leer: d.teile.length })}</div>`;
  }
  if (d.art === "teil") {
    return `<div class="pk">${druckRechnung([[S(d.z), ":", S(d.d), "=", L(d.q)]].concat(d.teile.map(t => [L(t), ":", S(d.d), "=", L(t / d.d)])), lsg, { leer: 3 })}</div>`;
  }
  if (d.art === "geld") {
    const frage = `<div class="pt">Ein Päckchen mit ${d.n} ${d.ding.mehr} kostet ${eu(d.ct)}&nbsp;€. Wie viel kostet ${d.ding.ein}?</div>`;
    const oben = ausrichten([[eu(d.ct) + "€", ":", S(d.n), "=", L(d.q + "ct")], [L(d.ct + "ct"), ":", S(d.n), "=", L(d.q + "ct")]]);
    let h = lsg ? druckZeile(oben[0], true) + druckZeile(oben[1]) + druckZeile([L(" " + d.q + "ct=" + eu(d.q) + "€")])
      : opt && opt.frei ? `<div class="pl"></div><div class="pl"></div><div class="pl"></div>`
      : druckZeile(oben[0].filter(x => typeof x === "string"), true) + `<div class="pl"></div><div class="pl"></div>`;
    return `<div class="pk">${frage}${h}</div>`;
  }
  if (d.art === "preis") {
    const w = d.ware.name;
    let frage, rech, vergl;
    if (d.sorte === "kg") {
      frage = `<b>${d.ware.ic} Welche Packung ${w} ist preiswerter?</b><br>Packung A: 1 kg kostet ${eu(d.pA)} €. &nbsp; Packung B: ${d.g} g kosten ${eu(d.packung)} €.`;
      rech = [["B:" + d.g + "g", "·", L(d.f), "=", L("1000g=1kg")], [eu(d.packung) + "€", "·", L(d.f), "=", L(eu(d.pB) + "€")]];
      vergl = [L(eu(d.pA) + "€" + (d.sieger === "A" ? "<" : ">") + eu(d.pB) + "€")];
    } else {
      frage = `<b>${d.ware.ic} Welche Packung ${w} ist preiswerter?</b><br>Packung A: ${d.nA * 100} g kosten ${eu(d.nA * d.uA)} €. &nbsp; Packung B: ${d.nB * 100} g kosten ${eu(d.nB * d.uB)} €.`;
      rech = [["A:" + d.nA * 100 + "g", ":", L(d.nA), "=", L("100g")], [eu(d.nA * d.uA) + "€", ":", L(d.nA), "=", L(d.uA + "ct")],
        ["B:" + d.nB * 100 + "g", ":", L(d.nB), "=", L("100g")], [eu(d.nB * d.uB) + "€", ":", L(d.nB), "=", L(d.uB + "ct")]];
      vergl = [L(d.uA + "ct" + (d.sieger === "A" ? "<" : ">") + d.uB + "ct")];
    }
    const zeilen = ausrichten(rech);
    let h = "";
    if (lsg) { h += zeilen.map(z => druckZeile(z)).join("") + druckZeile(vergl); }
    else for (let i = 0; i < rech.length + 1; i++) h += `<div class="pl"></div>`;
    return `<div class="pk"><div class="pt">${frage}</div>${h}<div class="pt">Antwort: ${lsg ? `<span class="l">Packung ${d.sieger} ist preiswerter.</span>` : "_".repeat(60)}</div></div>`;
  }
}

/* ========================== SPIELECKE ==========================
   Jede Spielrunde kostet Sterne. Sterne gibt es nur fürs Lernen.
   Preis hier ändern: */
const SPIEL_PREIS = 5;
const SPIELE = [
  { id: "bounce", name: "Bounceball", icon: "🏓", text: "Halte den Ball mit dem Balken in der Luft und zerschlage alle Steine. Jedes Level wird schneller!", start: () => bounceStart() },
  { id: "block", name: "Blockfall", icon: "🧱", text: "Drehe die fallenden Blöcke und mache volle Reihen. Wie Tetris, mit Levels.", start: () => blockStart() },
  { id: "weltraum", name: "Weltraum-Abwehr", icon: "🚀", text: "Schieße Meteore und Aliens ab und weiche ihren Laserschüssen aus.", start: () => weltraumStart() },
  { id: "ballon", name: "Ballonplatzen", icon: "🎈", text: "Platze in 30 Sekunden so viele Ballons wie du kannst!", start: () => ballonStart() },
  { id: "memory", name: "Memory", icon: "🐶", text: "Finde alle Tier-Paare mit möglichst wenigen Zügen.", start: () => memoryStart() },
  { id: "snake", name: "Snake", icon: "🐍", text: "Friss Äpfel und werde immer länger. Nicht gegen die Wand!", start: () => snakeStart() }
];
let spielTimer = [], spielTasten = null;
function spielStop() {
  spielTimer.forEach(t => { clearInterval(t); clearTimeout(t); cancelAnimationFrame(t); });
  spielTimer = [];
  if (spielTasten) { document.removeEventListener("keydown", spielTasten); document.removeEventListener("keyup", spielTasten); spielTasten = null; }
}
function rekord(id, wert, kleinerBesser) {
  let alt = null;
  try { const v = localStorage.getItem("ma_rekord_" + id); alt = v === null ? null : Number(v); } catch (e) {}
  const neu = alt === null || (kleinerBesser ? wert < alt : wert > alt);
  if (neu) { try { localStorage.setItem("ma_rekord_" + id, wert); } catch (e) {} }
  return { neu, rekord: neu ? wert : alt };
}
function rekordLesen(id) { try { const v = localStorage.getItem("ma_rekord_" + id); return v === null ? null : Number(v); } catch (e) { return null; } }

function spielecke() {
  spielStop();
  reiter("r_spiel");
  const genug = sterne >= SPIEL_PREIS;
  app.innerHTML = kopfleiste("🎮 Spielecke") + `
    <div class="box" style="text-align:center;margin-bottom:18px">
      <div style="font-size:26px">Du hast <b>⭐ ${sterne}</b> Sterne.</div>
      <p class="hinweis" style="margin:6px 0 0">${genug ? `Jede Spielrunde kostet ⭐ ${SPIEL_PREIS} Sterne.` : `Du brauchst ⭐ ${SPIEL_PREIS} Sterne für eine Runde. Lerne weiter, dann kannst du spielen! 📚`}</p>
    </div>
    <div class="modi">
      ${SPIELE.map(s => { const r = rekordLesen(s.id); return `<button class="modus" ${genug ? "" : "disabled"} onclick="spielKaufen('${s.id}')"><span class="ic">${s.icon}</span><b>${s.name}</b><small>${s.text}${r !== null ? `<br>🏅 Rekord: ${r}${s.id === "memory" ? " Züge" : ""}` : ""}</small><br><span class="preis">⭐ ${SPIEL_PREIS}</span></button>`; }).join("")}
    </div>
    ${genug ? "" : `<div class="mitte"><button class="btn gruen" onclick="startseite()">📚 Jetzt lernen</button></div>`}`;
}
function spielKaufen(id) {
  if (sterne < SPIEL_PREIS) return spielecke();
  sterne -= SPIEL_PREIS; zeigeSterne(); speichern();
  SPIELE.find(s => s.id === id).start();
}
function spielEnde(id, titel, text) {
  spielStop();
  const genug = sterne >= SPIEL_PREIS;
  app.innerHTML = kopfleiste(titel) + `<div class="box ende"><div class="gross">🎉</div><h2>${text}</h2><p>Du hast noch ⭐ ${sterne} Sterne.</p>
    <div class="mitte">${genug ? `<button class="btn gruen" onclick="spielKaufen('${id}')">Nochmal (⭐ ${SPIEL_PREIS})</button>` : ""}
    <button class="btn" onclick="spielecke()">Zur Spielecke</button><button class="btn grau" onclick="startseite()">📚 Weiter lernen</button></div></div>`;
}

/* ---------- Ballonplatzen ---------- */
function ballonStart() {
  spielStop();
  let punkte = 0, zeit = 30, ballons = [];
  app.innerHTML = kopfleiste("🎈 Ballonplatzen") + `<div class="spielinfo"><span>💥 <span id="bp">0</span></span><span>⏱️ <span id="bz">30</span> s</span></div><div class="himmel" id="himmel"></div>`;
  const himmel = document.getElementById("himmel");
  const farben = [0, 60, 120, 200, 280, 320];
  function neuerBallon() {
    const b = document.createElement("div");
    b.className = "ballon"; b.textContent = "🎈";
    const breite = himmel.clientWidth;
    const x = Math.random() * Math.max(10, breite - 60);
    b.style.left = x + "px"; b.style.top = himmel.clientHeight + "px";
    b.style.filter = `hue-rotate(${farben[Math.floor(Math.random() * farben.length)]}deg)`;
    const obj = { el: b, y: himmel.clientHeight, v: 1.4 + Math.random() * 1.8 + (30 - zeit) * 0.06 };
    b.addEventListener("pointerdown", e => {
      e.preventDefault(); if (obj.weg) return;
      obj.weg = true; punkte++; document.getElementById("bp").textContent = punkte;
      b.textContent = "💥"; b.style.filter = "none";
      setTimeout(() => b.remove(), 200);
    });
    himmel.appendChild(b); ballons.push(obj);
  }
  let letzte = performance.now();
  function schritt(jetzt) {
    const dt = Math.min(50, jetzt - letzte) / 16.7; letzte = jetzt;
    ballons.forEach(o => { if (o.weg) return; o.y -= o.v * dt; o.el.style.top = o.y + "px"; if (o.y < -80) { o.weg = true; o.el.remove(); } });
    ballons = ballons.filter(o => !o.weg || o.el.isConnected);
    spielTimer.push(requestAnimationFrame(schritt));
  }
  spielTimer.push(requestAnimationFrame(schritt));
  spielTimer.push(setInterval(neuerBallon, 550));
  spielTimer.push(setInterval(() => {
    zeit--; const z = document.getElementById("bz"); if (z) z.textContent = zeit;
    if (zeit <= 0) {
      const r = rekord("ballon", punkte, false);
      spielEnde("ballon", "🎈 Ballonplatzen", `Du hast ${punkte} Ballons geplatzt!${r.neu && punkte > 0 ? " 🏅 Neuer Rekord!" : ` (Rekord: ${r.rekord})`}`);
    }
  }, 1000));
  neuerBallon();
}

/* ---------- Memory ---------- */
function memoryStart() {
  spielStop();
  const tiere = mischen(["🐶", "🐱", "🦊", "🐼", "🐸", "🐵", "🦁", "🐰", "🐷", "🐨", "🐯", "🐮"]).slice(0, 8);
  const karten = mischen(tiere.concat(tiere));
  let offen = [], zuege = 0, gefunden = 0, sperre = false;
  app.innerHTML = kopfleiste("🐶 Memory") + `<div class="spielinfo"><span>🔄 Züge: <span id="mz">0</span></span><span>✅ Paare: <span id="mp">0</span> / 8</span></div>
    <div class="memory">${karten.map((t, i) => `<button class="mkarte" id="m${i}" onclick="memoryKlick(${i})">${t}</button>`).join("")}</div>`;
  window.memoryKlick = i => {
    const el = document.getElementById("m" + i);
    if (sperre || el.classList.contains("offen") || el.classList.contains("weg")) return;
    el.classList.add("offen"); offen.push(i);
    if (offen.length < 2) return;
    zuege++; document.getElementById("mz").textContent = zuege;
    const [a, b] = offen; offen = [];
    if (karten[a] === karten[b]) {
      gefunden++; document.getElementById("mp").textContent = gefunden;
      [a, b].forEach(j => { const e = document.getElementById("m" + j); e.classList.remove("offen"); e.classList.add("weg"); });
      if (gefunden === 8) spielTimer.push(setTimeout(() => {
        const r = rekord("memory", zuege, true);
        spielEnde("memory", "🐶 Memory", `Geschafft in ${zuege} Zügen!${r.neu ? " 🏅 Neuer Rekord!" : ` (Rekord: ${r.rekord} Züge)`}`);
      }, 600));
    } else {
      sperre = true;
      spielTimer.push(setTimeout(() => { [a, b].forEach(j => document.getElementById("m" + j).classList.remove("offen")); sperre = false; }, 900));
    }
  };
}

/* ---------- Snake ---------- */
function snakeStart() {
  spielStop();
  const N = 16, groesse = Math.min(400, document.getElementById("app").clientWidth - 20), z = Math.floor(groesse / N);
  app.innerHTML = kopfleiste("🐍 Snake") + `<div class="spielinfo"><span>🍎 <span id="sp">0</span></span></div>
    <canvas id="snake" width="${z * N}" height="${z * N}"></canvas>
    <p class="hinweis" style="text-align:center">Steuern mit den Pfeiltasten, durch Wischen oder mit den Knöpfen.</p>
    <div class="steuer"><span></span><button onclick="snakeRichtung(0,-1)">⬆️</button><span></span>
    <button onclick="snakeRichtung(-1,0)">⬅️</button><button onclick="snakeRichtung(0,1)">⬇️</button><button onclick="snakeRichtung(1,0)">➡️</button></div>`;
  const cv = document.getElementById("snake"), ctx = cv.getContext("2d");
  let schlange = [{ x: 7, y: 8 }, { x: 6, y: 8 }, { x: 5, y: 8 }], dir = { x: 1, y: 0 }, naechste = dir, apfel = null, punkte = 0, tempo = 170;
  function neuerApfel() {
    do { apfel = { x: Math.floor(Math.random() * N), y: Math.floor(Math.random() * N) }; }
    while (schlange.some(s => s.x === apfel.x && s.y === apfel.y));
  }
  window.snakeRichtung = (x, y) => { if (x !== -dir.x || y !== -dir.y) naechste = { x, y }; };
  spielTasten = e => {
    const m = { ArrowUp: [0, -1], ArrowDown: [0, 1], ArrowLeft: [-1, 0], ArrowRight: [1, 0], w: [0, -1], s: [0, 1], a: [-1, 0], d: [1, 0] }[e.key];
    if (m) { e.preventDefault(); snakeRichtung(m[0], m[1]); }
  };
  document.addEventListener("keydown", spielTasten);
  let tx = null, ty = null;
  cv.addEventListener("touchstart", e => { tx = e.touches[0].clientX; ty = e.touches[0].clientY; }, { passive: true });
  cv.addEventListener("touchend", e => {
    if (tx === null) return;
    const dx = e.changedTouches[0].clientX - tx, dy = e.changedTouches[0].clientY - ty; tx = null;
    if (Math.max(Math.abs(dx), Math.abs(dy)) < 20) return;
    if (Math.abs(dx) > Math.abs(dy)) snakeRichtung(dx > 0 ? 1 : -1, 0); else snakeRichtung(0, dy > 0 ? 1 : -1);
  });
  function malen() {
    ctx.fillStyle = "#1d3b2a"; ctx.fillRect(0, 0, cv.width, cv.height);
    ctx.fillStyle = "#e53935"; ctx.beginPath(); ctx.arc(apfel.x * z + z / 2, apfel.y * z + z / 2, z * 0.42, 0, Math.PI * 2); ctx.fill();
    schlange.forEach((s, i) => { ctx.fillStyle = i === 0 ? "#ffd84d" : "#6ccf6e"; ctx.fillRect(s.x * z + 1, s.y * z + 1, z - 2, z - 2); });
  }
  function takt() {
    dir = naechste;
    const kopf = { x: schlange[0].x + dir.x, y: schlange[0].y + dir.y };
    if (kopf.x < 0 || kopf.y < 0 || kopf.x >= N || kopf.y >= N || schlange.some(s => s.x === kopf.x && s.y === kopf.y)) {
      const r = rekord("snake", punkte, false);
      return spielEnde("snake", "🐍 Snake", `Du hast ${punkte} Äpfel gefressen!${r.neu && punkte > 0 ? " 🏅 Neuer Rekord!" : ` (Rekord: ${r.rekord})`}`);
    }
    schlange.unshift(kopf);
    if (kopf.x === apfel.x && kopf.y === apfel.y) {
      punkte++; document.getElementById("sp").textContent = punkte; neuerApfel();
      tempo = Math.max(80, tempo - 4);
    } else schlange.pop();
    malen();
    spielTimer.push(setTimeout(takt, tempo));
  }
  neuerApfel(); malen();
  spielTimer.push(setTimeout(takt, 600));
}

/* ---------- Gemeinsames für die Action-Spiele ---------- */
function spielSchleife(cv, schritt) {
  // Läuft, solange das Spielfeld auf der Seite ist. dt = 1 bei 60 Bildern pro Sekunde.
  let letzte = performance.now();
  function lauf(jetzt) {
    if (!cv.isConnected) return;
    const dt = Math.min(50, jetzt - letzte) / 16.7; letzte = jetzt;
    if (schritt(dt, jetzt) === false) return;

            explosion(f.x, f.y, f.art === "alien" ? "#76ff03" : "#bcaaa4", 16);
            if (Math.random() < 0.06) extras.push({ x: f.x, y: f.y });
          } else explosion(s.x, s.y, "#fff59d", 4);
        }
      });
      if (!f.weg && nah(f, schiff, f.r + schiff.r - 4)) { f.weg = true; explosion(f.x, f.y, "#bcaaa4", 12); getroffen(); }
    });
    feinde = feinde.filter(f => !f.weg && f.y < H + 40);
    laser.forEach(l => { l.x += l.vx * dt; l.y += l.vy * dt; if (nah(l, schiff, schiff.r - 4)) { l.weg = true; getroffen(); } });
    laser = laser.filter(l => !l.weg && l.y < H + 10 && l.y > -10 && l.x > -10 && l.x < W + 10);
    extras.forEach(e => { e.y += 2 * dt; if (nah(e, schiff, 26)) { e.weg = true; doppel = 480; } });
    extras = extras.filter(e => !e.weg && e.y < H + 20);
    funken.forEach(p => { p.x += p.vx * dt; p.y += p.vy * dt; p.t -= dt; }); funken = funken.filter(p => p.t > 0);
    sterneBg.forEach(s => { s.y += s.v * dt; if (s.y > H) { s.y = 0; s.x = Math.random() * W; } });
  }
  function malSchiff() {
    if (schutz > 0 && Math.floor(schutz / 6) % 2 === 0) return;
    const { x, y } = schiff;
    ctx.fillStyle = "#ff9800"; ctx.beginPath(); ctx.moveTo(x - 6, y + 14); ctx.lineTo(x, y + 24 + Math.random() * 8); ctx.lineTo(x + 6, y + 14); ctx.fill();
    ctx.fillStyle = "#90caf9"; ctx.beginPath(); ctx.moveTo(x, y - 20); ctx.lineTo(x + 18, y + 14); ctx.lineTo(x - 18, y + 14); ctx.closePath(); ctx.fill();
    ctx.fillStyle = "#1565c0"; ctx.beginPath(); ctx.arc(x, y, 5, 0, Math.PI * 2); ctx.fill();
  }
  function malen() {
    ctx.fillStyle = "#0b0d26"; ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = "#fff"; sterneBg.forEach(s => ctx.fillRect(s.x, s.y, s.v > 1.8 ? 2 : 1, s.v > 1.8 ? 2 : 1));
    ctx.fillStyle = "#ffee58"; schuesse.forEach(s => ctx.fillRect(s.x - 2, s.y - 8, 4, 12));
    ctx.fillStyle = "#ff1744"; laser.forEach(l => { ctx.beginPath(); ctx.arc(l.x, l.y, 4, 0, Math.PI * 2); ctx.fill(); });
    ctx.textAlign = "center"; ctx.textBaseline = "middle";
    feinde.forEach(f => {
      if (f.art === "alien") { ctx.font = "34px Segoe UI Emoji, Apple Color Emoji, sans-serif"; ctx.fillText("👾", f.x, f.y); }
      else {
        ctx.save(); ctx.translate(f.x, f.y); ctx.rotate(f.dreh);
        ctx.fillStyle = "#8d6e63"; ctx.beginPath();
        for (let i = 0; i < 9; i++) { const w = i / 9 * Math.PI * 2, rr = f.r * (0.82 + 0.18 * Math.sin(i * 2.7)); ctx.lineTo(Math.cos(w) * rr, Math.sin(w) * rr); }
        ctx.closePath(); ctx.fill();
        ctx.fillStyle = "#5d4037"; ctx.beginPath(); ctx.arc(f.r * 0.3, -f.r * 0.2, f.r * 0.22, 0, Math.PI * 2); ctx.arc(-f.r * 0.35, f.r * 0.3, f.r * 0.15, 0, Math.PI * 2); ctx.fill();
        ctx.restore();
      }
    });
    ctx.font = "26px Segoe UI Emoji, Apple Color Emoji, sans-serif"; extras.forEach(e => ctx.fillText("⚡", e.x, e.y));
    funken.forEach(p => { ctx.globalAlpha = p.t / 30; ctx.fillStyle = p.f; ctx.fillRect(p.x - 2, p.y - 2, 4, 4); }); ctx.globalAlpha = 1;
    if (leben > 0) malSchiff();
    if (doppel > 0) { ctx.fillStyle = "#ffee58"; ctx.font = "bold 16px Segoe UI, Arial"; ctx.textAlign = "left"; ctx.fillText("⚡ Doppelschuss", 10, 20); }
    if (pause) pauseText(ctx, W, H, "⏸ Pause", "P drücken zum Weiterspielen");
  }
  spielSchleife(cv, dt => {
    if (!pause) update(dt);
    malen();
    if (leben <= 0 && !ende) {
      ende = true;
      const r = rekord("weltraum", punkte, false);
      spielTimer.push(setTimeout(() => spielEnde("weltraum", "🚀 Weltraum-Abwehr", `Du hast ${punkte} Punkte geschafft (Welle ${welle})!${rekordText(r, punkte)}`), 900));
    }
  });
}

/* ========================== STERNE-CODE ==========================
   Sterne von einem Gerät auf ein anderes mitnehmen, ohne Konto.
   Der Code enthält die Sternzahl und eine Prüfsumme; jeder Code gilt nur einmal pro Gerät. */
const CODE_ZEICHEN = "23456789ABCDEFGHJKLMNPQRSTUVWXYZ";
const CODE_SCHLUESSEL = 0x3B9E52A7C1n;
function codePruef(v) { return ((v * 0x9E3779B1n + 0x2545Fn) >> 9n) & 0xFFFn; }
function codeMachen(anzahl) {
  const nonce = BigInt(Math.floor(Math.random() * 65536));
  const v = (BigInt(anzahl) << 16n) | nonce;
  let zahl = ((v << 12n) | codePruef(v)) ^ CODE_SCHLUESSEL;
  let out = "";
  for (let i = 0; i < 8; i++) { out = CODE_ZEICHEN[Number(zahl & 31n)] + out; zahl >>= 5n; }
  return out.slice(0, 4) + "-" + out.slice(4);
}
function codeLesen(text) {
  const t = text.toUpperCase().replace(/O/g, "0").replace(/I/g, "1").replace(/[^0-9A-Z]/g, "");
  if (t.length !== 8) return null;
  let zahl = 0n;
  for (const c of t) { const i = CODE_ZEICHEN.indexOf(c); if (i < 0) return null; zahl = (zahl << 5n) | BigInt(i); }
  zahl ^= CODE_SCHLUESSEL;
  const v = zahl >> 12n;
  if ((zahl & 0xFFFn) !== codePruef(v)) return null;
  return { anzahl: Number(v >> 16n), id: v.toString(36) };
}
function sterneUebertragen(meldung) {
  spielStop();
  reiter("r_ueben");
  app.innerHTML = kopfleiste("🔑 Sterne-Code") + `
    <div class="box" style="margin-bottom:18px">
      <h2 style="margin-top:0">📤 Sterne mitnehmen</h2>
      <p>Du hast <b>⭐ ${sterne}</b> Sterne. Wenn du einen Code machst, wandern alle Sterne in den Code und sind auf diesem Gerät weg. Gib den Code dann auf dem anderen Gerät ein.</p>
      <div id="codeAusgabe">${sterne > 0 ? `<button class="btn" onclick="codeErzeugen()">Code machen</button>` : `<p class="hinweis">Du hast gerade keine Sterne zum Mitnehmen.</p>`}</div>
    </div>
    <div class="box">
      <h2 style="margin-top:0">📥 Sterne einlösen</h2>
      <p>Code vom anderen Gerät eingeben:</p>
      <div class="leiste"><input class="codeeingabe" id="codeIn" maxlength="9" placeholder="XXXX-XXXX" onkeydown="if(event.key==='Enter')codeEinloesen()"><button class="btn gruen" onclick="codeEinloesen()">Einlösen</button></div>
      <div class="feedback" id="codeFb">${meldung || ""}</div>
    </div>`;
}
function codeErzeugen(sicher) {
  if (sterne <= 0) return;
  if (!sicher) {
    document.getElementById("codeAusgabe").innerHTML = `<p>Alle <b>⭐ ${sterne}</b> Sterne in einen Code packen? Auf diesem Gerät sind sie dann weg, bis der Code eingelöst wird.</p><div class="leiste"><button class="btn" onclick="codeErzeugen(true)">Ja, Code machen</button><button class="btn grau" onclick="sterneUebertragen()">Abbrechen</button></div>`;
    return;
  }
  const anzahl = Math.min(sterne, 4095), code = codeMachen(anzahl);
  sterne -= anzahl; zeigeSterne(); speichern();
  document.getElementById("codeAusgabe").innerHTML = `<p>Dein Code für <b>⭐ ${anzahl}</b> Sterne:</p><div class="code">${code}</div>
    <p class="hinweis">Schreib ihn dir auf! Du kannst ihn auch hier wieder einlösen, falls du es dir anders überlegst.</p>`;
}
function codeEinloesen() {
  const fb = document.getElementById("codeFb"), wert = document.getElementById("codeIn").value, c = codeLesen(wert);
  if (!c) { fb.className = "feedback nein"; fb.textContent = "Dieser Code stimmt nicht. Schau nochmal genau hin."; return; }
  let benutzt = [];
  try { benutzt = JSON.parse(localStorage.getItem("ma_codes") || "[]"); } catch (e) {}
  if (benutzt.includes(c.id)) { fb.className = "feedback nein"; fb.textContent = "Diesen Code hast du hier schon eingelöst."; return; }
  benutzt.push(c.id);
  try { localStorage.setItem("ma_codes", JSON.stringify(benutzt)); } catch (e) {}
  sterne += c.anzahl; zeigeSterne(); speichern();
  sterneUebertragen(`<span style="color:var(--gruen)">✔ ${c.anzahl} Sterne sind angekommen! Du hast jetzt ⭐ ${sterne}.</span>`);
}
zeigeSterne();
startseite();
</script>
