<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Deutsch Lernapp</title>
<style>
:root{
  --orange:#1597c9; --orange-d:#0d6f96; --rot:#c8322f; --blau:#1f5fbf; --gruen:#2e9e4f;
  --gelb:#ffd84d; --bg:#eaf6fb; --akzent:#0b5f86; --karte:#ffffff; --text:#2b2b2b; --grau:#777;
}
*{box-sizing:border-box}
button,input{touch-action:manipulation;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:"Segoe UI",Verdana,Arial,sans-serif;background:var(--bg);color:var(--text);font-size:20px}
header{background:linear-gradient(90deg,#16a3cf,#1f5fbf);color:#fff;padding:14px 20px;display:flex;align-items:center;gap:14px;flex-wrap:wrap;box-shadow:0 3px 8px rgba(0,0,0,.15)}
header h1{margin:0;font-size:28px;flex:1;cursor:pointer}
.sterne{background:rgba(255,255,255,.2);border-radius:999px;padding:6px 16px;font-weight:bold;font-size:22px}
main{max-width:980px;margin:0 auto;padding:20px 16px 60px}
h2{color:var(--akzent);margin:10px 0 12px}
.hinweis{color:var(--grau);font-size:17px;margin:0 0 14px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:24px}
.chip{border:3px solid var(--orange);background:#fff;border-radius:999px;padding:8px 14px;font-size:17px;cursor:pointer;font-family:inherit}
.chip.an{background:var(--orange);color:#fff}
.modi{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:16px}
.modus{background:var(--karte);border:none;border-radius:20px;padding:22px 16px;text-align:center;cursor:pointer;box-shadow:0 4px 0 var(--orange-d),0 6px 14px rgba(0,0,0,.1);font-family:inherit;font-size:20px;transition:transform .1s}
.modus:hover{transform:translateY(-3px)}
.modus .ic{font-size:54px;display:block;margin-bottom:6px}
.modus b{display:block;font-size:23px;color:var(--akzent)}
.modus small{color:var(--grau);font-size:16px}
.leiste{display:flex;align-items:center;gap:10px;margin-bottom:16px;flex-wrap:wrap}
.btn{border:none;border-radius:14px;padding:12px 20px;font-size:20px;font-family:inherit;cursor:pointer;background:var(--orange);color:#fff;box-shadow:0 3px 0 var(--orange-d);font-weight:bold}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--orange-d)}
.btn.grau{background:#ddd;color:#333;box-shadow:0 3px 0 #aaa}
.btn.gruen{background:var(--gruen);box-shadow:0 3px 0 #1d6b34}
.btn.blau{background:var(--blau);box-shadow:0 3px 0 #123c7a}
.btn.klein{padding:8px 14px;font-size:17px}
.fortschritt{flex:1;min-width:140px;height:16px;background:#fff;border-radius:999px;overflow:hidden;border:2px solid var(--orange)}
.fortschritt div{height:100%;background:var(--gruen);transition:width .3s}
.box{background:var(--karte);border-radius:22px;padding:24px;box-shadow:0 6px 16px rgba(0,0,0,.1)}
.kapitel{font-size:15px;color:#fff;background:var(--blau);display:inline-block;padding:3px 10px;border-radius:999px;margin-bottom:10px}
/* Karteikarten */
.flip{perspective:1200px;cursor:pointer;margin:0 auto;max-width:640px}
.flip-in{position:relative;min-height:320px;transition:transform .5s;transform-style:preserve-3d}
.flip.offen .flip-in{transform:rotateY(180deg)}
.seite{position:absolute;inset:0;backface-visibility:hidden;border-radius:24px;padding:26px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;box-shadow:0 6px 16px rgba(0,0,0,.15)}
.vorne{background:#fff;border:5px solid var(--orange)}
.hinten{background:#eaf7ee;border:5px solid var(--gruen);transform:rotateY(180deg)}
.seite .txt{font-size:25px;line-height:1.35}
.seite .tipp{position:absolute;bottom:10px;font-size:15px;color:var(--grau)}
.schild{width:150px;height:150px;margin-bottom:10px}
.mitte{display:flex;justify-content:center;gap:12px;margin-top:18px;flex-wrap:wrap}
/* Quiz */
.frage{font-size:25px;font-weight:bold;margin:6px 0 16px;line-height:1.3}
.optionen{display:grid;gap:10px}
.opt{text-align:left;border:3px solid #ddd;background:#fff;border-radius:16px;padding:14px 16px;font-size:21px;font-family:inherit;cursor:pointer}
.opt:hover{border-color:var(--orange)}
.opt.gewaehlt{border-color:var(--blau);background:#e8f0fc}
.opt.richtig{border-color:var(--gruen);background:#dff3e5}
.opt.falsch{border-color:var(--rot);background:#fbe1e0}
.feedback{font-size:22px;margin-top:14px;font-weight:bold;min-height:30px}
.feedback.ok{color:var(--gruen)} .feedback.nein{color:var(--rot)}
/* Zuordnen */
.spalten{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.feld{border:3px solid #ddd;background:#fff;border-radius:16px;padding:12px;font-size:19px;cursor:pointer;margin-bottom:10px;display:flex;align-items:center;gap:10px;min-height:64px;font-family:inherit;width:100%;text-align:left}
.feld svg{width:76px;height:76px;flex:none}
.feld.aktiv{border-color:var(--blau);background:#e8f0fc}
.feld.fertig{border-color:var(--gruen);background:#dff3e5;cursor:default;opacity:.75}
.wackel{animation:wackel .35s}
@keyframes wackel{0%,100%{transform:translateX(0)}25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
/* Reihenfolge */
.liste{list-style:none;padding:0;margin:0 0 16px}
.liste li{background:#dff3e5;border:3px solid var(--gruen);border-radius:14px;padding:10px 14px;margin-bottom:8px;font-size:19px}
.liste li b{color:var(--gruen);margin-right:6px}
.auswahl .feld{justify-content:flex-start}
.ende{text-align:center;padding:30px 10px}
.ende .gross{font-size:72px}
.vorlesen{background:none;border:2px solid var(--blau);color:var(--blau);border-radius:999px;padding:8px 14px;font-size:16px;cursor:pointer;font-family:inherit}
@media (max-width:600px){
  body{font-size:18px} header h1{font-size:22px}
  .spalten{grid-template-columns:1fr}
  .seite .txt{font-size:21px} .frage{font-size:21px}
}
/* Rätsel */
.loesung{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:10px}
.lbuchst{width:30px;height:36px;border:2px solid var(--orange);border-radius:6px;display:flex;align-items:center;justify-content:center;font-weight:bold;font-size:20px;background:#fff}
.lbuchst.da{background:var(--gelb)}
.kaestchen{display:flex;flex-wrap:wrap;gap:4px;justify-content:center;margin:6px 0 14px}
.kaestchen span{width:34px;height:40px;border:2px solid #999;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:bold;background:#fff}
.szene{width:400px;max-width:100%;border:2px solid #ddd;border-radius:12px;margin-bottom:10px;background:#fff}
.kaestchen span.ziel{background:#ffd9a8;border-color:var(--orange-d)}
/* Spielecke */
.preis{display:inline-block;background:var(--gelb);color:#5a4300;border-radius:999px;padding:2px 10px;font-size:16px;font-weight:bold;margin-top:6px}
.modus:disabled{opacity:.45;cursor:not-allowed;transform:none}
.spielinfo{display:flex;gap:16px;justify-content:center;font-size:22px;font-weight:bold;margin-bottom:10px;flex-wrap:wrap}
.himmel{position:relative;height:440px;border-radius:22px;overflow:hidden;background:linear-gradient(#8fd3ff,#e6f7ff);touch-action:manipulation;user-select:none}
.ballon{position:absolute;font-size:58px;cursor:pointer;line-height:1;user-select:none}
.memory{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;max-width:460px;margin:0 auto}
.mkarte{aspect-ratio:1;border:none;border-radius:16px;font-size:44px;cursor:pointer;background:var(--orange);color:transparent;box-shadow:0 3px 0 var(--orange-d);font-family:inherit}
.mkarte.offen{background:#fff;color:inherit;box-shadow:0 3px 0 #ccc}
.mkarte.weg{background:#dff3e5;color:inherit;box-shadow:none;opacity:.6;cursor:default}
.spielfeld{display:block;margin:0 auto;border-radius:14px;width:auto;height:auto;max-width:100%;max-height:calc(100vh - 230px);touch-action:none;user-select:none}
.tetris{display:flex;gap:14px;justify-content:center;align-items:flex-start}
.tetris .spielfeld{margin:0;min-width:0;max-width:calc(100% - 134px)}
.tseite{flex:none;width:120px;font-size:16px;background:var(--karte);border-radius:16px;padding:10px;text-align:center;box-shadow:0 3px 10px rgba(0,0,0,.08)}
.tseite canvas{display:block;margin:6px auto 0;border-radius:10px}
#snake{display:block;margin:0 auto;background:#1d3b2a;border-radius:14px;max-width:100%;touch-action:none}
.steuer{display:grid;grid-template-columns:repeat(3,70px);gap:8px;justify-content:center;margin-top:12px}
.steuer button{height:60px;font-size:28px;border:none;border-radius:14px;background:var(--blau);color:#fff;cursor:pointer}
.code{font-family:Consolas,monospace;font-size:40px;letter-spacing:4px;background:#fff;border:4px dashed var(--orange);border-radius:16px;padding:12px 20px;display:inline-block;margin:10px 0}
.codeeingabe::placeholder{font-size:20px;letter-spacing:1px;text-transform:none}
.codeeingabe{font-family:Consolas,monospace;font-size:30px;letter-spacing:3px;text-transform:uppercase;padding:10px 14px;border:3px solid var(--orange);border-radius:14px;width:260px;max-width:100%;text-align:center}
.feedback.tipp{color:#8a5a00}
.chip.wichtig{border-color:#e0a100}
.chip.wichtig.an{background:#e0a100}
.badge{display:inline-block;background:var(--gelb);color:#5a4300;border-radius:999px;padding:1px 8px;font-size:13px;font-weight:bold;vertical-align:middle}
.seite .txt{white-space:pre-line}
/* Satzzeichen / Wortarten / Groß-klein */
.satz{font-size:26px;line-height:2.3;margin:10px 0 6px;padding:12px 10px;background:#f7fbff;border-radius:16px;border:2px solid #dbe8f3}
.swort{display:inline;margin:0 1px}
.luecke{display:inline-flex;align-items:center;justify-content:center;min-width:26px;height:42px;padding:0 4px;margin:0 3px;vertical-align:middle;border:2px dashed #a9bdd2;border-radius:9px;background:#fff;font:bold 30px Georgia,"Times New Roman",serif;color:var(--blau);cursor:pointer}
.luecke.voll{border-style:solid;border-color:var(--blau);background:#e8f0fc}
.luecke.aktiv{border-color:#e0a100;background:#fff3c4;box-shadow:0 0 0 3px #ffe28a}
.luecke.ok{border-color:var(--gruen);background:#dff3e5;color:var(--gruen)}
.luecke.leer{opacity:.35}
.luecke.falsch{border-color:var(--rot);border-style:solid;background:#fbe1e0;color:var(--rot)}
.palette{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin:14px 0 4px}
.palette button{width:66px;height:70px;border:none;border-radius:14px;background:var(--blau);color:#fff;cursor:pointer;box-shadow:0 3px 0 #123c7a;font:bold 34px Georgia,"Times New Roman",serif;line-height:1}
.palette button small{display:block;font:12px "Segoe UI",Arial,sans-serif;margin-top:4px}
.palette button.weg{background:#888;box-shadow:0 3px 0 #555}
.palette button:active{transform:translateY(2px)}
.stifte{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:6px}
.stift{border:3px solid transparent;border-radius:999px;padding:8px 14px;font:inherit;font-size:18px;font-weight:bold;cursor:pointer}
.stift.N{background:#cfe3ff;color:#174a9c} .stift.V{background:#ffdcb8;color:#8a4300} .stift.A{background:#cdeed5;color:#1d6b34} .stift.X{background:#eee;color:#444}
.stift.an{border-color:#222;box-shadow:0 0 0 3px #ffe28a}
.wa,.gk{font:inherit;font-size:26px;border:3px solid transparent;border-radius:10px;padding:0 6px;margin:2px 0;background:#fff;cursor:pointer;color:var(--text)}
.wa.N{background:#cfe3ff;border-color:#3b82f6} .wa.V{background:#ffdcb8;border-color:#f28c28} .wa.A{background:#cdeed5;border-color:#2e9e4f}
.gk.gross{background:#fff3c4;border-color:#e0a100;font-weight:bold}
.wa.falsch,.gk.falsch{border-color:var(--rot)!important;border-style:dashed!important;box-shadow:0 0 0 2px #fbe1e0}
.gk.ok{background:#dff3e5;border-color:var(--gruen)}
.grosswort{font-size:44px;letter-spacing:4px;font-weight:bold;text-align:center;background:#e8f6fc;color:#0b5f86;border-radius:999px;padding:12px 18px;margin:8px auto 16px;max-width:520px;word-break:break-word}
.beweis-zeile{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:10px 0;font-size:22px}
.beweis-zeile .vor{min-width:120px;color:var(--grau)}
.eingabe{font:inherit;font-size:22px;padding:8px 12px;border:3px solid #c9d3e0;border-radius:12px;width:240px;max-width:100%}
.eingabe.ok{border-color:var(--gruen);background:#dff3e5} .eingabe.falsch{border-color:var(--rot);background:#fbe1e0}
.chip.falsch{border-color:var(--rot);background:#fbe1e0;color:var(--rot)}
/* Schreiben */
.werkzeug{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
.werkzeug .btn.an{outline:4px solid var(--gelb);outline-offset:1px}
.heftwrap{border-radius:12px;border:2px solid #d6dde8;overflow:hidden;background:#fffef8;box-shadow:inset 0 2px 6px rgba(0,0,0,.06)}
#heft{display:block;width:100%;touch-action:none;cursor:crosshair;-webkit-user-select:none;user-select:none}
.muster{background:#eaf7ee;border:3px solid var(--gruen);border-radius:16px;padding:14px 18px;font-size:24px;line-height:1.6;font-family:"Segoe Print","Comic Sans MS","Chalkboard SE",cursive;color:#1f3c9a}
.check label{display:flex;gap:10px;align-items:center;font-size:20px;margin:8px 0;cursor:pointer}
.check input{width:26px;height:26px;flex:none}
@media (max-width:600px){ .satz{font-size:21px} .wa,.gk{font-size:21px} .grosswort{font-size:32px} .palette button{width:54px;height:62px;font-size:28px} }
</style>
</head>
<body>
<header>
  <h1 onclick="startseite()">📚 Deutsch – Lernapp</h1>
  <span class="sterne" id="sterne" style="cursor:pointer" title="Zur Spielecke" onclick="spielecke()">⭐ 0</span>
</header>
<main id="app"></main>

<script>
/* =====================================================================
   LERNINHALTE DEUTSCH (4. Klasse)
   Alles, was gelernt wird, steht hier. Neues Material einfach als
   weiteres Kapitel ans Ende der Liste anhängen (gleicher Aufbau).

   Aufbau eines Kapitels:
   {
     id: "kurzname", titel: "Name", icon: "💬", wichtig: true (= kommt in der Probe dran),
     karten:  [ { f: "Vorderseite", a: "Rückseite" } ],
     quiz:    [ { f: "Frage", o: ["Antwort A", "Antwort B"], r: [0] } ],   // r = richtige Antworten (0 = erste)
     paare:   [ { a: "links", b: "rechts" } ],
     reihen:  [ { titel: "Aufgabe", schritte: ["1.", "2.", ...] } ],
     raetsel: [ { titel: "Rätsel", luecke: true, fragen: [ { f: "Frage", w: "Wort", p: -1 } ] } ],
     zeichen: [ { s: "Satz mit allen Satzzeichen" } ],          // Satzzeichen setzen
     gross:   [ { s: "Satz richtig geschrieben" } ],            // Groß oder klein?
     wortarten: [ { s: "Der [kluge|A] [Hund|N] [bellt|V]." } ],  // N = Nomen, V = Verb, A = Adjektiv
     beweise: [ { w: "Hund", typ: "N", art: "der", mz: "Hunde" },             // mz: null = keine Mehrzahl
                { w: "zählt", typ: "V", gf: "zählen", du: "zählst", er: "zählt", ihr: "zählt" },
                { w: "klug", typ: "A", k1: "klüger", k2: "klügsten" } ],    // k2 ohne „am“
     schreiben: [ { f: "Aufgabe", muster: ["Lösung Zeile 1", ...], zeilen: 4, check: ["Darauf achten", ...] } ]
   }
   ===================================================================== */
const CHECK_REDE = ["Begleitsatz mit Doppelpunkt :", "Anführungszeichen unten „ am Anfang der Rede", "Die Rede fängt groß an", "Satzzeichen (. ? !) steht vor dem Schlusszeichen", "Anführungszeichen oben “ am Ende"];
const CHECK_SATZ = ["Satzanfang groß geschrieben", "Nomen groß geschrieben", "Richtiges Satzzeichen am Ende (. ? !)"];

const INHALTE = [
{
  id: "rede", titel: "Wörtliche Rede", icon: "💬", wichtig: true,
  karten: [
    { f: "Was ist wörtliche Rede?", a: "Das, was jemand genau so sagt, wie er es sagt (Wort für Wort). Die wörtliche Rede steht in Anführungszeichen: „Essen ist fertig!“" },
    { f: "Was ist der Begleitsatz?", a: "Der Begleitsatz sagt, WER spricht und WIE er spricht: Die Köchin ruft: …" },
    { f: "Welches Zeichen steht nach dem Begleitsatz (wenn er vorne steht)?", a: "Ein Doppelpunkt : → Die Köchin ruft:" },
    { f: "Wie sehen die Anführungszeichen aus?", a: "Am Anfang der Rede unten „ und am Ende oben “. Merke: unten 99 – oben 66." },
    { f: "Wo steht das Satzzeichen (. ? !) der wörtlichen Rede?", a: "Innen, also VOR dem Anführungszeichen oben: „Essen ist fertig!“" },
    { f: "Wie fängt die wörtliche Rede an?", a: "Immer mit einem großen Buchstaben: Lisa ruft: „Los, Arel!“" },
    { f: "Wann steht in der wörtlichen Rede ein Punkt?", a: "Wenn jemand etwas aussagt oder erzählt: Der Dieb stammelt: „Ich war das nicht.“" },
    { f: "Wann steht in der wörtlichen Rede ein Fragezeichen?", a: "Wenn jemand etwas fragt: Die Freundin möchte wissen: „Wann kannst du zu mir kommen?“" },
    { f: "Wann steht in der wörtlichen Rede ein Ausrufezeichen?", a: "Bei einem Ausruf oder einer Aufforderung: Die Nachbarin schimpft: „Macht den Fernseher leiser!“" },
    { f: "In welcher Reihenfolge schreibe ich wörtliche Rede?", a: "Begleitsatz → Doppelpunkt : → „ → Rede (groß anfangen) → Satzzeichen . ? ! → “" },
    { f: "Welche Wörter kann ich statt „sagen“ benutzen?", a: "rufen, schreien, fragen, antworten, flüstern, schimpfen, betteln, jammern, seufzen, klagen, stammeln, mahnen, fordern, vorschlagen, sich erkundigen, wissen wollen …" },
    { f: "Wo kann der Begleitsatz stehen?", a: "Vorne (dann kommt ein Doppelpunkt): Die Köchin ruft: „Essen ist fertig!“\nOder hinten (dann kommt ein Komma): „Essen ist fertig!“, ruft die Köchin." },
    { f: "Was ist bei „Die Köchin ruft: Essen ist fertig!“ der Begleitsatz und was die wörtliche Rede?", a: "Begleitsatz: Die Köchin ruft:  –  Wörtliche Rede: Essen ist fertig!" }
  ],
  quiz: [
    { f: "Welches Zeichen steht nach dem Begleitsatz „Die Köchin ruft“?", o: ["Ein Doppelpunkt :", "Ein Komma ,", "Ein Punkt ."], r: [0] },
    { f: "Wie sieht das Anführungszeichen am Anfang der wörtlichen Rede aus?", o: ["„ (unten)", "“ (oben)", "! (Ausrufezeichen)"], r: [0] },
    { f: "Wie sieht das Anführungszeichen am Ende der wörtlichen Rede aus?", o: ["„ (unten)", "“ (oben)", ": (Doppelpunkt)"], r: [1] },
    { f: "Welcher Satz ist richtig geschrieben?", o: ["Die Köchin ruft: „Essen ist fertig!“", "Die Köchin ruft „Essen ist fertig!“", "Die Köchin ruft: „Essen ist fertig“!", "Die Köchin ruft: „essen ist fertig!“"], r: [0] },
    { f: "Welcher Satz ist richtig geschrieben?", o: ["Der Dieb stammelt: „Ich war das nicht“.", "Der Dieb stammelt: „Ich war das nicht.“", "Der Dieb stammelt. „Ich war das nicht.“"], r: [1] },
    { f: "Welcher Satz ist richtig geschrieben?", o: ["Emre fragt: „wann bekommen wir die neuen Arbeitshefte?“", "Emre fragt: „Wann bekommen wir die neuen Arbeitshefte.“", "Emre fragt: „Wann bekommen wir die neuen Arbeitshefte?“"], r: [2] },
    { f: "Welches Satzzeichen fehlt? Die Freundin möchte wissen: „Wann kannst du zu mir kommen _“", o: ["?", "!", "."], r: [0] },
    { f: "Welches Satzzeichen fehlt? Der Vater schlägt vor: „Wir können heute Pizza essen gehen _“", o: ["?", "."], r: [1] },
    { f: "Welches Satzzeichen fehlt? Die Nachbarin schimpft: „Macht den Fernseher leiser _“", o: ["!", "?"], r: [0] },
    { f: "Welches Satzzeichen fehlt? Das kleine Kind bettelt: „Darf ich ein Eis essen _“", o: ["!", "?", "."], r: [1] },
    { f: "Was ist hier der Begleitsatz? Der Vater schlägt vor: „Wir können heute Pizza essen gehen.“", o: ["Der Vater schlägt vor", "Wir können heute Pizza essen gehen"], r: [0] },
    { f: "Was ist hier die wörtliche Rede? Ivan jammert: „Oje!“", o: ["Ivan jammert", "Oje!"], r: [1] },
    { f: "Wo steht das Ausrufezeichen?", o: ["Vor dem Anführungszeichen oben: …fertig!“", "Hinter dem Anführungszeichen oben: …fertig“!"], r: [0] },
    { f: "Welches Wort passt? Der Dieb ___: „Ich … ich war das nicht.“", o: ["stammelt", "jubelt", "singt"], r: [0] },

function zeigeSterne() { document.getElementById("sterne").textContent = "⭐ " + sterne; }
function mischen(a) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function esc(s) { return String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c])); }
function kapitelListe() { return INHALTE.filter(k => gewaehlt.has(k.id)); }
function sammle(art) { const out = []; kapitelListe().forEach(k => (k[art] || []).forEach(x => out.push(Object.assign({ kapitel: k.titel }, x)))); return out; }
function bildHtml() { return ""; }

function vorlesen(text) {
  try {
    if (!window.speechSynthesis) return;
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = "de-DE"; u.rate = 0.95;
    const stimme = speechSynthesis.getVoices().find(v => v.lang && v.lang.startsWith("de"));
    if (stimme) u.voice = stimme;
    speechSynthesis.speak(u);
  } catch (e) {}
}
const kannVorlesen = !!window.speechSynthesis;
function vorleseKnopf(text) { return kannVorlesen ? `<button class="vorlesen" onclick='event.stopPropagation();vorlesen(${JSON.stringify(text).replace(/'/g, "&#39;")})'>🔊 Vorlesen</button>` : ""; }

function kopfleiste(titel, anteil) {
  return `<div class="leiste"><button class="btn grau klein" onclick="startseite()">⬅ Zurück</button><h2 style="margin:0">${titel}</h2>${anteil != null ? `<div class="fortschritt"><div style="width:${Math.round(anteil * 100)}%"></div></div>` : ""}</div>`;
}
function fertig(titel, text, nochmal) {
  app.innerHTML = kopfleiste(titel) + `<div class="box ende"><div class="gross">🏆</div><h2>${text}</h2><p>Du hast jetzt insgesamt ⭐ ${sterne} Sterne.</p><div class="mitte"><button class="btn gruen" onclick="${nochmal}">Nochmal!</button><button class="btn grau" onclick="startseite()">Zur Übersicht</button></div></div>`;
}
function leer(titel) {
  app.innerHTML = kopfleiste(titel) + `<div class="box ende"><div class="gross">🤷</div><p>Für die gewählten Kapitel gibt es hier noch nichts. Wähle auf der Startseite andere Kapitel aus.</p></div>`;
}

/* ---------- Startseite ---------- */

      ${modus("satzzeichen()", "✒️", "Satzzeichen setzen", "Punkt, Fragezeichen, Doppelpunkt, „ “ …", "zeichen")}
      ${modus("wortartenDetektiv()", "🔍", "Wortarten-Detektiv", "Nomen, Verben, Adjektive markieren", "wortarten")}

      ${modus("raetsel()", "🧩", "Rätsel & Lückentext", "Fehlende Wörter finden", "raetsel")}

}
function nurProbeThemen() { gewaehlt = new Set(INHALTE.filter(k => k.wichtig).map(k => k.id)); speichern(); startseite(); }
function alleKapitel() { gewaehlt = new Set(INHALTE.map(k => k.id)); speichern(); startseite(); }
function kapitelUmschalten(id) {
  if (gewaehlt.size === INHALTE.length) gewaehlt = new Set([id]);
  else if (gewaehlt.has(id)) { gewaehlt.delete(id); if (!gewaehlt.size) gewaehlt = new Set(INHALTE.map(k => k.id)); }
  else gewaehlt.add(id);
  speichern(); startseite();
}

/* ---------- Karteikarten ---------- */
let stapel = [], kartenGesamt = 0, kartenGewusst = 0;
function karteikarten() {
  stapel = mischen(sammle("karten"));
  if (!stapel.length) return leer("🃏 Karteikarten");
  kartenGesamt = stapel.length; kartenGewusst = 0;
  zeigeKarte();
}
function zeigeKarte() {
  if (!stapel.length) return fertig("🃏 Karteikarten", "Super! Du kennst alle Karten! 🎉", "karteikarten()");
  const k = stapel[0];
  app.innerHTML = kopfleiste("🃏 Karteikarten", kartenGewusst / kartenGesamt) + `
    <p class="hinweis">Noch ${stapel.length} Karten. Tippe auf die Karte zum Umdrehen.</p>
    <div class="flip" id="flip" onclick="this.classList.toggle('offen')">
      <div class="flip-in">
        <div class="seite vorne"><span class="kapitel">${esc(k.kapitel)}</span>${bildHtml(k.bild)}<div class="txt">${esc(k.f)}</div><div class="mitte">${vorleseKnopf(k.f)}</div><span class="tipp">👆 Antippen zum Umdrehen</span></div>
        <div class="seite hinten">${bildHtml(k.bild)}<div class="txt">${esc(k.a)}</div><div class="mitte">${vorleseKnopf(k.a)}</div></div>
      </div>
    </div>
    <div class="mitte">
      <button class="btn grau" onclick="karteNochmal()">🔁 Nochmal üben</button>
      <button class="btn gruen" onclick="karteGewusst()">✔ Wusste ich!</button>
    </div>`;
}
function karteGewusst() {
  const k = stapel.shift(); kartenGewusst++;
  const heute = new Date().toDateString(); let kk = { d: heute, l: [] };
  try { const g = JSON.parse(localStorage.getItem("de_kk") || "null"); if (g && g.d === heute) kk = g; } catch (e) {}
  if (!kk.l.includes(k.f + "|" + k.a)) { kk.l.push(k.f + "|" + k.a); sternDazu(); try { localStorage.setItem("de_kk", JSON.stringify(kk)); } catch (e) {} }
  zeigeKarte();
}
function karteNochmal() { stapel.push(stapel.shift()); zeigeKarte(); }


/* ====================== AUFGABEN-RUNDEN ======================
   Quiz, Satzzeichen, Wortarten, Beweise und Groß/klein laufen alle über
   dieselbe Runde. Jede Aufgabe ruft am Ende genau einmal ergebnis(ok) auf. */
let R = { liste: [], i: 0, richtig: 0, titel: "", nochmal: "" };
function runde(liste, titel, nochmal) {
  if (!liste.length) return leer(titel);
  R = { liste, i: 0, richtig: 0, titel, nochmal };
  zeigeAufgabe();
}
function zeigeAufgabe() {
  if (R.i >= R.liste.length) {
    const n = R.liste.length, lob = R.richtig === n ? "Alles richtig! Du bist ein Deutsch-Profi! 🎉" : R.richtig >= n * 0.7 ? "Toll gemacht! 👍" : "Gut geübt! Weiter so! 💪";
    return fertig(R.titel, `${R.richtig} von ${n} richtig. ${lob}`, R.nochmal);
  }
  const t = R.liste[R.i];
  app.innerHTML = kopfleiste(R.titel, R.i / R.liste.length) + `
    <div class="box"><span class="kapitel">${esc(t.kapitel || "")}</span> <span class="hinweis">Aufgabe ${R.i + 1} von ${R.liste.length}</span>
      <div id="aufgabe"></div>
      <div class="feedback" id="fb"></div>
      <div class="mitte" id="weiter"></div>
    </div>`;
  ({ quiz: zeigeQuiz, zeichen: zeigeZeichen, wortarten: zeigeWortarten, beweise: zeigeBeweis, gross: zeigeGross })[t._a](t, document.getElementById("aufgabe"));
}
let erledigtSchon = false;
function ergebnis(ok, text) {
  if (erledigtSchon) return;
  erledigtSchon = true;
  const fb = document.getElementById("fb");
  if (ok) { R.richtig++; sternDazu(); fb.className = "feedback ok"; fb.textContent = text || mischen(["Richtig! 🎉", "Super! ⭐", "Genau so! 👍", "Klasse! 📚"])[0]; }
  else { fb.className = "feedback nein"; fb.textContent = text || "Leider nicht ganz. Schau dir die Lösung genau an."; }
  document.getElementById("weiter").innerHTML = `<button class="btn gruen" onclick="R.i++;zeigeAufgabe()">Weiter ➜</button>`;
}
function hinweis(text, art) { const fb = document.getElementById("fb"); fb.className = "feedback " + (art || "nein"); fb.innerHTML = text; }
function wackeln(el) { el.classList.remove("wackel"); void el.offsetWidth; el.classList.add("wackel"); }
function typ(art) { return sammle(art).map(x => Object.assign({ _a: art }, x)); }

/* ---------- Quiz ---------- */
let qAuswahl = new Set(), qAkt = null;
function quiz() { runde(mischen(typ("quiz")).slice(0, 12), "❓ Quiz", "quiz()"); }
function zeigeQuiz(q, box) {
  erledigtSchon = false; qAuswahl = new Set();
  qAkt = Object.assign({}, q, { opts: mischen(q.o.map((t, i) => ({ t, ok: q.r.includes(i) }))) });
  const anzahl = q.r.length;
  box.innerHTML = `<div class="frage">${esc(q.f)} ${vorleseKnopf(q.f + ". " + qAkt.opts.map(o => o.t).join(". "))}</div>
    ${anzahl > 1 ? `<p class="hinweis">Hier sind <b>${anzahl}</b> Antworten richtig. Tippe sie an und drücke dann „Prüfen“.</p>` : ""}
    <div class="optionen">${qAkt.opts.map((o, i) => `<button class="opt" id="o${i}" onclick="qWaehle(${i})">${esc(o.t)}</button>`).join("")}</div>
    ${anzahl > 1 ? `<div class="mitte" id="qpruef"><button class="btn blau" onclick="qPruefen()">Prüfen</button></div>` : ""}`;
}
function qWaehle(i) {
  if (erledigtSchon) return;
  if (qAkt.r.length === 1) { qAuswahl = new Set([i]); return qPruefen(); }
  if (qAuswahl.has(i)) qAuswahl.delete(i); else qAuswahl.add(i);
  document.getElementById("o" + i).classList.toggle("gewaehlt", qAuswahl.has(i));
}
function qPruefen() {
  if (erledigtSchon) return;
  if (!qAuswahl.size) return hinweis("Tippe zuerst eine Antwort an.", "tipp");
  let ok = true;
  qAkt.opts.forEach((o, i) => {
    const el = document.getElementById("o" + i);
    el.classList.remove("gewaehlt");
    if (o.ok) el.classList.add("richtig");
    if (qAuswahl.has(i) !== o.ok) { ok = false; if (qAuswahl.has(i)) el.classList.add("falsch"); }
  });
  const p = document.getElementById("qpruef"); if (p) p.remove();
  ergebnis(ok, ok ? null : "Leider nicht ganz. Die richtige Antwort ist grün markiert.");
}

/* ---------- Satzzeichen setzen ----------
   Zwischen allen Wörtern ist eine Lücke. In jede Lücke kommen die Zeichen,
   die dort hingehören (auch mehrere, z. B. „!“,“). */
const ZEICHEN = ["." , "?", "!", ":", ",", "„", "“"];
const ZEICHEN_NAME = { ".": "Punkt", "?": "Frage", "!": "Ausruf", ":": "Doppelp.", ",": "Komma", "„": "unten", "“": "oben" };
let zz = null;
function satzzeichen() { runde(mischen(typ("zeichen")).slice(0, 10), "✒️ Satzzeichen setzen", "satzzeichen()"); }
function zerlegeSatz(s) {
  const woerter = [], luecken = [""];
  (s.match(/[„“:.,!?]|[^\s„“:.,!?]+/g) || []).forEach(t => {
    if (ZEICHEN.includes(t)) luecken[luecken.length - 1] += t;
    else { woerter.push(t); luecken.push(""); }
  });
  return { woerter, luecken };
}
function zeigeZeichen(t, box) {
  erledigtSchon = false;
  const z = zerlegeSatz(t.s);
  zz = { woerter: z.woerter, ziel: z.luecken, ein: z.luecken.map(() => ""), akt: 0, versuche: 0, s: t.s };
  box.innerHTML = `<div class="frage">Setze alle fehlenden Satzzeichen ein.</div>
    <p class="hinweis">Tippe auf eine Lücke ▢ und dann auf ein Zeichen. In eine Lücke können auch mehrere Zeichen. Leere Lücken bleiben leer.</p>
    <div class="satz" id="satz"></div>
    <div class="palette">${ZEICHEN.map(c => `<button onclick="zzSetze('${c}')">${c}<small>${ZEICHEN_NAME[c]}</small></button>`).join("")}<button class="weg" onclick="zzWeg()">⌫<small>löschen</small></button></div>
    <div class="mitte" id="zzpruef"><button class="btn blau" onclick="zzPruefen()">Prüfen</button></div>`;
  zzMalen();
}
function zzMalen(markiert) {
  let h = "";
  zz.ein.forEach((e, i) => {
    let cls = "luecke" + (e ? " voll" : "") + (i === zz.akt && !erledigtSchon ? " aktiv" : "");
    if (markiert) cls += e === zz.ziel[i] ? (e ? " ok" : " leer") : " falsch";
    h += `<button class="${cls}" onclick="zzWaehle(${i})">${esc(e) || "&nbsp;"}</button>`;
    if (i < zz.woerter.length) h += `<span class="swort">${esc(zz.woerter[i])}</span>`;
  });
  document.getElementById("satz").innerHTML = h;
}
function zzWaehle(i) { if (erledigtSchon) return; zz.akt = i; zzMalen(); }
function zzSetze(c) {
  if (erledigtSchon) return;
  if (zz.ein[zz.akt].length >= 3) return;
  zz.ein[zz.akt] += c; zzMalen();
}
function zzWeg() { if (erledigtSchon) return; zz.ein[zz.akt] = zz.ein[zz.akt].slice(0, -1); zzMalen(); }
function zzPruefen() {
  if (erledigtSchon) return;
  const falsch = zz.ein.filter((e, i) => e !== zz.ziel[i]).length;
  if (!falsch) { zzMalen(true); document.getElementById("zzpruef").innerHTML = ""; return ergebnis(zz.versuche === 0, zz.versuche === 0 ? null : "Jetzt ist alles richtig! 👍"); }
  zz.versuche++;
  zzMalen(true);
  const tipp = zzTipp();
  if (zz.versuche >= 3) {
    document.getElementById("zzpruef").innerHTML = `<button class="btn blau" onclick="zzPruefen()">Nochmal prüfen</button><button class="btn grau" onclick="zzLoesung()">Lösung zeigen</button>`;
  }
  hinweis(`${falsch === 1 ? "Eine Lücke ist" : falsch + " Lücken sind"} noch falsch (rot). ${tipp}`);
}
function zzTipp() {
  const s = zz.s;
  if (s.startsWith("„")) return "Tipp: Begleitsatz hinten → nach dem “ kommt ein Komma, am Ende ein Punkt.";
  if (s.includes(":")) return "Tipp: Nach dem Begleitsatz kommt : und dann „ – am Ende erst . ? ! und dann “.";
  if (s.endsWith("?")) return "Tipp: Ist das eine Frage?";
  return "Tipp: Ist es eine Aussage (.), eine Frage (?) oder ein Ausruf (!)?";
}
function zzLoesung() {
  zz.ein = zz.ziel.slice(); zzMalen(true);
  document.getElementById("zzpruef").innerHTML = "";
  ergebnis(false, "So ist es richtig: " + zz.s);
}

/* ---------- Wortarten-Detektiv ---------- */
const WA = { N: { name: "Nomen", farbe: "blau" }, V: { name: "Verb", farbe: "orange" }, A: { name: "Adjektiv", farbe: "grün" } };
let wa = null;
function wortartenDetektiv() { runde(mischen(typ("wortarten")).slice(0, 8), "🔍 Wortarten-Detektiv", "wortartenDetektiv()"); }
function zeigeWortarten(t, box) {
  erledigtSchon = false;
  const teile = [];
  (t.s.match(/\[[^\]]+\]|[^\s\[\]]+/g) || []).forEach(x => {
    const m = x.match(/^\[([^|]+)\|([NVA])\]$/);
    if (m) return teile.push({ w: m[1], ziel: m[2], nach: "" });
    const r = x.match(/^(.*?)([.,!?]*)$/);
    if (r[1]) teile.push({ w: r[1], ziel: "", nach: r[2] });
    else if (teile.length) teile[teile.length - 1].nach += r[2];
  });
  wa = { teile: teile.map(x => Object.assign({ ein: "" }, x)), stift: "N", versuche: 0 };
  box.innerHTML = `<div class="frage">Markiere alle Nomen, Verben und Adjektive.</div>
    <p class="hinweis">Wähle eine Farbe und tippe dann auf die Wörter. Wörter, die nichts davon sind, bleiben weiß.</p>
    <div class="stifte">
      <button class="stift N an" id="stN" onclick="waStift('N')">🖍️ Nomen</button>
      <button class="stift V" id="stV" onclick="waStift('V')">🖍️ Verb</button>
      <button class="stift A" id="stA" onclick="waStift('A')">🖍️ Adjektiv</button>
      <button class="stift X" id="stX" onclick="waStift('')">🧽 Radierer</button>
    </div>
    <div class="satz" id="satz"></div>
    <div class="mitte" id="wapruef"><button class="btn grau klein" onclick="waZaehlen()">💡 Wie viele sind es?</button><button class="btn blau" onclick="waPruefen()">Prüfen</button></div>`;
  waMalen();
}
function waStift(s) { wa.stift = s; ["N", "V", "A", "X"].forEach(k => document.getElementById("st" + k).classList.toggle("an", (s || "X") === k)); }
function waMalen(markiert) {
  document.getElementById("satz").innerHTML = wa.teile.map((x, i) => {
    let cls = "wa " + (x.ein || "");
    if (markiert) cls += x.ein === x.ziel ? (x.ziel ? " ok" : "") : " falsch";
    return `<button class="${cls}" onclick="waTipp(${i})">${esc(x.w)}</button>${x.nach ? `<span class="swort">${esc(x.nach)}</span>` : ""}`;
  }).join(" ");
}
function waTipp(i) { if (erledigtSchon) return; const x = wa.teile[i]; x.ein = x.ein === wa.stift ? "" : wa.stift; waMalen(); }
function waZaehlen() {
  const n = k => wa.teile.filter(x => x.ziel === k).length;
  hinweis(`Es sind ${n("N")} Nomen, ${n("V")} Verben und ${n("A")} Adjektive.`, "tipp");
}
function waPruefen() {
  if (erledigtSchon) return;
  const falsch = wa.teile.filter(x => x.ein !== x.ziel);
  waMalen(true);
  if (!falsch.length) { document.getElementById("wapruef").innerHTML = ""; return ergebnis(wa.versuche === 0, wa.versuche === 0 ? null : "Jetzt ist alles richtig! 👍"); }
  wa.versuche++;
  const x = falsch[0];
  const tipp = x.ziel === "N" ? `„${x.w}“: Kannst du der, die oder das davor setzen?` : x.ziel === "V" ? `„${x.w}“: Kannst du ich, du, er davor setzen?` : x.ziel === "A" ? `„${x.w}“: Kannst du es steigern?` : `„${x.w}“ ist kein Nomen, Verb oder Adjektiv.`;
  hinweis(`${falsch.length === 1 ? "Ein Wort ist" : falsch.length + " Wörter sind"} noch falsch (rot umrandet). Tipp: ${tipp}`);
  if (wa.versuche >= 3) document.getElementById("wapruef").innerHTML = `<button class="btn blau" onclick="waPruefen()">Nochmal prüfen</button><button class="btn grau" onclick="waLoesung()">Lösung zeigen</button>`;
}
function waLoesung() { wa.teile.forEach(x => x.ein = x.ziel); waMalen(true); document.getElementById("wapruef").innerHTML = ""; ergebnis(false, "So ist es richtig: Nomen blau, Verben orange, Adjektive grün."); }

/* ---------- Beweise ----------
   1. Welche Wortart? 2. Beweis eintippen. */
let bw = null;
function beweise() { runde(mischen(typ("beweise")).slice(0, 10), "🕵️ Beweise", "beweise()"); }
function norm(s) { return String(s).trim().toLowerCase().replace(/\s+/g, " "); }
function zeigeBeweis(t, box) {
  erledigtSchon = false;
  bw = { t, schritt: 1, fehler: 0, art: "" };
  box.innerHTML = `<div class="frage">Welche Wortart ist das? Beweise es!</div>
    <div class="grosswort">${esc(t.w.toUpperCase())}</div>
    <div id="bwInhalt"><div class="mitte">${["N", "V", "A"].map(k => `<button class="btn ${k === "N" ? "blau" : k === "V" ? "" : "gruen"}" id="bw${k}" onclick="bwArt('${k}')">${WA[k].name}</button>`).join("")}</div></div>`;

}
function rekordLesen(id) { try { const v = localStorage.getItem("de_rekord_" + id); return v === null ? null : Number(v); } catch (e) { return null; } }

/* ---------- Snake ---------- */
function snakeStart() {
  spielStop();
  const N = 16, groesse = Math.min(400, document.getElementById("app").clientWidth - 20), z = Math.floor(groesse / N);
  app.innerHTML = kopfleiste("🐍 Snake") + `<div class="spielinfo"><span>🍎 <span id="sp">0</span></span></div>
    <canvas id="snake" width="${z * N}" height="${z * N}"></canvas>
    <p class="hinweis" style="text-align:center">Steuern mit den Pfeiltasten, durch Wischen oder mit den Knöpfen.</p>
    <div class="steuer"><span></span><button onclick="snakeRichtung(0,-1)">⬆️</button><span></span>
    <button onclick="snakeRichtung(-1,0)">⬅️</button><button onclick="snakeRichtung(0,1)">⬇️</button><button onclick="snakeRichtung(1,0)">➡️</button></div>`;
  const cv = document.getElementById("snake"), ctx = cv.getContext("2d");
  let schlange = [{ x: 7, y: 8 }, { x: 6, y: 8 }, { x: 5, y: 8 }], dir = { x: 1, y: 0 }, naechste = dir, apfel = null, punkte = 0, tempo = 170;
  function neuerApfel() {
    do { apfel = { x: Math.floor(Math.random() * N), y: Math.floor(Math.random() * N) }; }
    while (schlange.some(s => s.x === apfel.x && s.y === apfel.y));
  }
  window.snakeRichtung = (x, y) => { if (x !== -dir.x || y !== -dir.y) naechste = { x, y }; };
  spielTasten = e => {
    const m = { ArrowUp: [0, -1], ArrowDown: [0, 1], ArrowLeft: [-1, 0], ArrowRight: [1, 0], w: [0, -1], s: [0, 1], a: [-1, 0], d: [1, 0] }[e.key];
    if (m) { e.preventDefault(); snakeRichtung(m[0], m[1]); }
  };
  document.addEventListener("keydown", spielTasten);
  let tx = null, ty = null;
  cv.addEventListener("touchstart", e => { tx = e.touches[0].clientX; ty = e.touches[0].clientY; }, { passive: true });
  cv.addEventListener("touchend", e => {
    if (tx === null) return;
    const dx = e.changedTouches[0].clientX - tx, dy = e.changedTouches[0].clientY - ty; tx = null;
    if (Math.max(Math.abs(dx), Math.abs(dy)) < 20) return;
    if (Math.abs(dx) > Math.abs(dy)) snakeRichtung(dx > 0 ? 1 : -1, 0); else snakeRichtung(0, dy > 0 ? 1 : -1);
  });
  function malen() {
    ctx.fillStyle = "#1d3b2a"; ctx.fillRect(0, 0, cv.width, cv.height);
    ctx.fillStyle = "#e53935"; ctx.beginPath(); ctx.arc(apfel.x * z + z / 2, apfel.y * z + z / 2, z * 0.42, 0, Math.PI * 2); ctx.fill();
    schlange.forEach((s, i) => { ctx.fillStyle = i === 0 ? "#ffd84d" : "#6ccf6e"; ctx.fillRect(s.x * z + 1, s.y * z + 1, z - 2, z - 2); });
  }
  function takt() {
    dir = naechste;
    const kopf = { x: schlange[0].x + dir.x, y: schlange[0].y + dir.y };
    if (kopf.x < 0 || kopf.y < 0 || kopf.x >= N || kopf.y >= N || schlange.some(s => s.x === kopf.x && s.y === kopf.y)) {
      const r = rekord("snake", punkte, false);
      return spielEnde("snake", "🐍 Snake", `Du hast ${punkte} Äpfel gefressen!${r.neu && punkte > 0 ? " 🏅 Neuer Rekord!" : ` (Rekord: ${r.rekord})`}`);
    }
    schlange.unshift(kopf);
    if (kopf.x === apfel.x && kopf.y === apfel.y) {
      punkte++; document.getElementById("sp").textContent = punkte; neuerApfel();
      tempo = Math.max(80, tempo - 4);
    } else schlange.pop();
    malen();
    spielTimer.push(setTimeout(takt, tempo));
  }
  neuerApfel(); malen();
  spielTimer.push(setTimeout(takt, 600));
}

/* ---------- Bounceball (Breakout) ---------- */
function bounceStart() {
  spielStop();
  const W = 480, H = 600;
  app.innerHTML = kopfleiste("🏓 Bounceball") + `<div class="spielinfo"><span>🏆 <span id="bbp">0</span></span><span>❤️ <span id="bbl">3</span></span><span>📶 Level <span id="bbv">1</span></span></div>
    <canvas id="bounce" class="spielfeld" width="${W}" height="${H}"></canvas>
    <p class="hinweis" style="text-align:center">Balken mit Maus, Finger oder ⬅️ ➡️ steuern. Klick oder Leertaste schießt den Ball ab. P = Pause.</p>`;
  const cv = document.getElementById("bounce"), ctx = cv.getContext("2d");
  const FARBEN = ["#ef5350", "#ffa726", "#ffee58", "#66bb6a", "#42a5f5", "#ab47bc", "#ec407a", "#26c6da"];
  let punkte = 0, leben = 3, level = 1, pause = false, links = false, rechts = false;
  const p = { x: W / 2, w: 90, h: 14, y: H - 34 };
  let ball, steine;
  function tempoBasis() { return 5 + level * 0.7; }
  function neuerBall() { ball = { x: p.x, y: p.y - 9, vx: 0, vy: 0, r: 8, klebt: true, s: tempoBasis() }; }
  function neuesLevel() {
    const reihen = Math.min(8, 4 + level), spalten = 10, bw = 44, bh = 18, gap = 4, links0 = (W - (spalten * bw + (spalten - 1) * gap)) / 2;
    steine = [];
    for (let r = 0; r < reihen; r++) for (let c = 0; c < spalten; c++) {
      // ab Level 2 Lücken-Muster, ab Level 2 harte Steine (2 Treffer), ab Level 4 sehr harte (3 Treffer)
      if (level >= 3 && (r + c + level) % 7 === 0) continue;
      let haerte = 1;
      if (level >= 2 && r < Math.min(level - 1, 3)) haerte = 2;
      if (level >= 4 && r === 0) haerte = 3;
      steine.push({ x: links0 + c * (bw + gap), y: 70 + r * (bh + gap), w: bw, h: bh, hp: haerte, farbe: FARBEN[r % FARBEN.length] });
    }
    p.w = Math.max(56, 96 - level * 6);
    neuerBall();
    document.getElementById("bbv").textContent = level;

/* ---------- Blockfall (Tetris) ---------- */
function blockStart() {

        <p class="hinweis" style="margin:8px 0 0;font-size:15px">⬅️ ➡️ bewegen<br>⬆️ drehen<br>⬇️ schneller<br>Leertaste: fallen lassen<br>P: Pause</p></div>
    </div>
    <div class="steuer" style="grid-template-columns:repeat(5,64px)">
      <button onclick="blockTaste('ArrowLeft')">⬅️</button><button onclick="blockTaste('ArrowUp')">🔄</button><button onclick="blockTaste('ArrowRight')">➡️</button><button onclick="blockTaste('ArrowDown')">⬇️</button><button onclick="blockTaste(' ')">⏬</button></div>`;
  const cv = document.getElementById("tfeld"), ctx = cv.getContext("2d"), nv = document.getElementById("tnext"), nctx = nv.getContext("2d");
  const FORMEN = {

    O: { m: [[1, 1], [1, 1]], f: "#ffd54f" },
    T: { m: [[0, 1, 0], [1, 1, 1], [0, 0, 0]], f: "#ab47bc" },
    S: { m: [[0, 1, 1], [1, 1, 0], [0, 0, 0]], f: "#66bb6a" },
    Z: { m: [[1, 1, 0], [0, 1, 1], [0, 0, 0]], f: "#ef5350" },
    J: { m: [[1, 0, 0], [1, 1, 1], [0, 0, 0]], f: "#42a5f5" },
    L: { m: [[0, 0, 1], [1, 1, 1], [0, 0, 0]], f: "#ffa726" }

    if (teil.m.some((r, ri) => r.some(v => v) && teil.y + ri < 0)) { vorbei = true; return; }

    teil.m.forEach((r, ri) => r.forEach((v, ci) => { if (v && teil.y + ri >= 0) zelle(ctx, teil.x + ci, teil.y + ri, teil.f, Z); }));

  });

        for (let i = 0; i < 9; i++) { const w = i / 9 * Math.PI * 2, rr = f.r * (0.82 + 0.18 * Math.sin(i * 2.7)); ctx.lineTo(Math.cos(w) * rr, Math.sin(w) * rr); }
        ctx.closePath(); ctx.fill();
        ctx.fillStyle = "#5d4037"; ctx.beginPath(); ctx.arc(f.r * 0.3, -f.r * 0.2, f.r * 0.22, 0, Math.PI * 2); ctx.arc(-f.r * 0.35, f.r * 0.3, f.r * 0.15, 0, Math.PI * 2); ctx.fill();
        ctx.restore();
      }
    });
    ctx.font = "26px Segoe UI Emoji, Apple Color Emoji, sans-serif"; extras.forEach(e => ctx.fillText("⚡", e.x, e.y));
    funken.forEach(p => { ctx.globalAlpha = p.t / 30; ctx.fillStyle = p.f; ctx.fillRect(p.x - 2, p.y - 2, 4, 4); }); ctx.globalAlpha = 1;
    if (leben > 0) malSchiff();
    if (doppel > 0) { ctx.fillStyle = "#ffee58"; ctx.font = "bold 16px Segoe UI, Arial"; ctx.textAlign = "left"; ctx.fillText("⚡ Doppelschuss", 10, 20); }
    if (pause) pauseText(ctx, W, H, "⏸ Pause", "P drücken zum Weiterspielen");
  }
  spielSchleife(cv, dt => {
    if (!pause) update(dt);
    malen();
    if (leben <= 0 && !ende) {
      ende = true;
      const r = rekord("weltraum", punkte, false);
      spielTimer.push(setTimeout(() => spielEnde("weltraum", "🚀 Weltraum-Abwehr", `Du hast ${punkte} Punkte geschafft (Welle ${welle})!${rekordText(r, punkte)}`), 900));
    }
  });
}

/* ========================== STERNE-CODE ==========================
   Sterne von einem Gerät auf ein anderes mitnehmen, ohne Konto.
   Der Code enthält die Sternzahl und eine Prüfsumme; jeder Code gilt nur einmal pro Gerät. */
const CODE_ZEICHEN = "23456789ABCDEFGHJKLMNPQRSTUVWXYZ";
const CODE_SCHLUESSEL = 0x6D2B47E9C5n;
function codePruef(v) { return ((v * 0x9E3779B1n + 0x2545Fn) >> 9n) & 0xFFFn; }
function codeMachen(anzahl) {
  const nonce = BigInt(Math.floor(Math.random() * 65536));
  const v = (BigInt(anzahl) << 16n) | nonce;
  let zahl = ((v << 12n) | codePruef(v)) ^ CODE_SCHLUESSEL;
  let out = "";
  for (let i = 0; i < 8; i++) { out = CODE_ZEICHEN[Number(zahl & 31n)] + out; zahl >>= 5n; }
  return out.slice(0, 4) + "-" + out.slice(4);
}
function codeLesen(text) {
  const t = text.toUpperCase().replace(/O/g, "0").replace(/I/g, "1").replace(/[^0-9A-Z]/g, "");
  if (t.length !== 8) return null;
  let zahl = 0n;
  for (const c of t) { const i = CODE_ZEICHEN.indexOf(c); if (i < 0) return null; zahl = (zahl << 5n) | BigInt(i); }
  zahl ^= CODE_SCHLUESSEL;
  const v = zahl >> 12n;
  if ((zahl & 0xFFFn) !== codePruef(v)) return null;
  return { anzahl: Number(v >> 16n), id: v.toString(36) };
}
function sterneUebertragen(meldung) {
  spielStop();
  app.innerHTML = kopfleiste("🔑 Sterne-Code") + `
    <div class="box" style="margin-bottom:18px">
      <h2 style="margin-top:0">📤 Sterne mitnehmen</h2>
      <p>Du hast <b>⭐ ${sterne}</b> Sterne. Wenn du einen Code machst, wandern alle Sterne in den Code und sind auf diesem Gerät weg. Gib den Code dann auf dem anderen Gerät ein.</p>
      <div id="codeAusgabe">${sterne > 0 ? `<button class="btn" onclick="codeErzeugen()">Code machen</button>` : `<p class="hinweis">Du hast gerade keine Sterne zum Mitnehmen.</p>`}</div>
    </div>
    <div class="box">
      <h2 style="margin-top:0">📥 Sterne einlösen</h2>
      <p>Code vom anderen Gerät eingeben:</p>
      <div class="leiste"><input class="codeeingabe" id="codeIn" autocomplete="off" autocorrect="off" spellcheck="false" maxlength="9" placeholder="XXXX-XXXX" onkeydown="if(event.key==='Enter')codeEinloesen()"><button class="btn gruen" onclick="codeEinloesen()">Einlösen</button></div>
      <div class="feedback" id="codeFb">${meldung || ""}</div>
    </div>`;
}
function codeErzeugen() {
  if (sterne <= 0) return;
  const box = document.getElementById("codeAusgabe");
  if (!box.dataset.sicher) {
    box.dataset.sicher = "1";
    box.innerHTML = `<p>Alle ⭐ ${sterne} Sterne in einen Code packen? Auf diesem Gerät sind sie dann weg, bis der Code eingelöst wird.</p><div class="leiste"><button class="btn" onclick="codeErzeugen()">Ja, Code machen</button><button class="btn grau" onclick="sterneUebertragen()">Abbrechen</button></div>`;
    return;
  }
  const anzahl = Math.min(sterne, 4095), code = codeMachen(anzahl);
  sterne -= anzahl; zeigeSterne(); speichern();
  document.getElementById("codeAusgabe").innerHTML = `<p>Dein Code für <b>⭐ ${anzahl}</b> Sterne:</p><div class="code">${code}</div>
    <p class="hinweis">Schreib ihn dir auf! Du kannst ihn auch hier wieder einlösen, falls du es dir anders überlegst.</p>`;
}
function codeEinloesen() {
  const fb = document.getElementById("codeFb"), wert = document.getElementById("codeIn").value, c = codeLesen(wert);
  if (!c) { fb.className = "feedback nein"; fb.textContent = "Dieser Code stimmt nicht. Schau nochmal genau hin."; return; }
  let benutzt = [];
  try { benutzt = JSON.parse(localStorage.getItem("de_codes") || "[]"); } catch (e) {}
  if (benutzt.includes(c.id)) { fb.className = "feedback nein"; fb.textContent = "Diesen Code hast du hier schon eingelöst."; return; }
  benutzt.push(c.id);
  try { localStorage.setItem("de_codes", JSON.stringify(benutzt)); } catch (e) {}
  sterne += c.anzahl; zeigeSterne(); speichern();
  sterneUebertragen(`<span style="color:var(--gruen)">✔ ${c.anzahl} Sterne sind angekommen! Du hast jetzt ⭐ ${sterne}.</span>`);
}

zeigeSterne();
startseite();
</script>
